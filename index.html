/* 最上方提示條：載入中給等待秒數，連不上時給原因與「重新連線」按鈕 */
function renderSetupBar(){
  const bar = $('setupBar');
  if(!bar) return;
  let msg = '', retry = false;
  const secs = cloud.t0 ? Math.max(1, Math.round((Date.now()-cloud.t0)/1000)) : 0;
  if(isTeacher() && (!API.isCloud() || !CONFIG.PASSWORD)){
    msg = '連不上雲端：輪值教師也要連上試算表才能點名。請確認網路，或請管理員檢查 Apps Script 是否已部署新版本。';
  }else if(!API.isCloud()){
    msg = '目前是本機模式：資料一律存在雲端試算表，本機不留名冊資料，本機模式不會存檔。要接回雲端請到「設定與檢查」取消本機模式。';
  }else if(!CONFIG.PASSWORD){
    msg = '還缺通關密語：請到「設定與檢查」輸入密語並按「儲存設定」，就會開始讀取試算表。';
  }else if(cloud.loading){
    msg = cloud.retries
      ? ('連線不穩，正在自動重試第 '+cloud.retries+' 次…' + (cloud.lastError ? '（'+cloud.lastError+'）' : ''))
      : ('正在從雲端試算表讀取名冊…' + (secs > 1 ? '已等 '+secs+' 秒' : ''));
  }else if(cloud.failed){
    msg = '連不上雲端試算表：' + (cloud.lastError || '網路不通') + '。程式最多自動重試 3 次，也可以現在按「重新連線」。'
      + ((state.students||[]).length ? '畫面上是上次載入的名冊，還沒跟雲端同步。' : '本機不保存名冊，所以目前畫面沒有資料。');
    retry = true;
  }else if(!cloud.authoritative){
    msg = '正在從雲端試算表讀取名冊…';
  }else if(!state.students.length){
    msg = '試算表目前沒有名冊資料：請先在「名單」工作表建立，或到「設定與檢查」匯入備份檔。';
  }
  bar.hidden = !msg;
  bar.innerHTML = esc(msg) + (retry ? ' <button class="btn tiny" data-reloadcloud="1">重新連線</button>' : '');

/* ---------- 學生清單 ---------- */
function listRows(){
  const q = (ui.q||'').trim().toLowerCase();
  return state.students.filter(function(s){
    if(ui.rcls && s.cls!==ui.rcls) return false;
    if(ui.show==='in' && s.active===false) return false;
    if(ui.show==='out' && s.active!==false) return false;
    if(!q) return true;
    return listHit(s, q);
  }).sort((a,b)=> a.cls-b.cls || a.seat.localeCompare(b.seat));
}

/* 搜尋：姓名、學號、座號、班級，或「班級＋座號」連寫（90101 就找 901 班 01 號） */
function listHit(s, q){
  const name = String(s.name||'').toLowerCase();
  if(name.indexOf(q) >= 0) return true;
  const cls = String(s.cls);
  const seat = String(s.seat||'').padStart(2,'0');
  const full = cls + seat;
  const sid = String(s.sid||'');
  if(full === q) return true;
  if(q.length >= 3 && cls.indexOf(q) === 0) return true;
  if(q.length >= 4 && full.indexOf(q) === 0) return true;
  if(seat === q) return true;
  if(sid && q.length >= 5 && sid.indexOf(q) >= 0) return true;
  return false;
}

function dropSeatOf(key){
  Object.keys(state.seats).forEach(sl=>{ if(state.seats[sl]===key) delete state.seats[sl]; });
  Object.keys(state.seatPair||{}).forEach(sl=>{ if(state.seatPair[sl]===key) delete state.seatPair[sl]; });
}

function setActive(key, on){
  const s = E.byKey(state,key); if(!s) return;
  if(!on){ openExit(key); return; }
  const date = ref();
  const before = E.daysAt(state,key,date).slice();
  s.active = true;
  ui.pick.delete(key);
  if(!before.some(Boolean) && s.days.some(Boolean)){
    state.enrollments.push({ id:newId('e'), key:key, date:date, days:s.days.slice(), from:before,
      reason:'加入夜自習', kind:'join', createdAt:new Date().toISOString() });
  }
  commit();
  toast('已將 '+s.name+' 設為參加，記得設定參加日', 3600);
}

function batchActive(on){
  const keys = [...ui.pick]; if(!keys.length) return;
  if(!on){ openExitBatch(keys); return; }
  const date = ref();
  keys.forEach(function(k){
    const s = E.byKey(state,k); if(!s) return;
    const before = E.daysAt(state,k,date).slice();
    s.active = true;
    if(!before.some(Boolean) && s.days.some(Boolean)){
      state.enrollments.push({ id:newId('e'), key:k, date:date, days:s.days.slice(), from:before,
        reason:'加入夜自習', kind:'join', createdAt:new Date().toISOString() });
    }
  });
  ui.pick.clear();
  commit();
  toast('已設為參加 '+keys.length+' 人', 3000);
}

/* 退出夜自習：一定要填原因，並寫入異動日誌 */
function openExit(key){
  const s = E.byKey(state,key); if(!s) return;
  const cur = E.daysAt(state,key,ref());
  const body = '<div class="hint">'+s.cls+'-'+s.seat+'　'+esc(s.name)+'　目前參加：'+E.label(cur)+'</div>'
    + '<div class="field"><label>生效日</label><input type="date" id="oDate" value="'+ref()+'"></div>'
    + '<div class="field"><label>退出原因（必填）</label><input id="oWhy" placeholder="例如：家長來電改為不參加、轉學"></div>'
    + '<label class="chk"><input type="checkbox" id="oPrint"> 同時列印退班通知（格式同違規通知單，A4 橫式三聯）</label>'
    + '<p class="hint">退出後座位會釋出，並在異動日誌留下一筆紀錄；生效日之前的統計不受影響。</p>';
  const m = modal('退出夜自習', body, '<button class="btn" data-close>取消</button><button class="btn seal" id="oSave">確定退出</button>');
  m.querySelector('[data-close]').addEventListener('click', closeModal);
  m.querySelector('#oSave').addEventListener('click', function(){
    const why = m.querySelector('#oWhy').value.trim();
    if(!why){ toast('請填寫退出原因'); m.querySelector('#oWhy').focus(); return; }
    const date = m.querySelector('#oDate').value || ref();
    const before = E.daysAt(state,key,date).slice();
    s.active = false;
    dropSeatOf(key);
    ui.pick.delete(key);
    state.enrollments.push({ id:newId('e'), key:key, date:date, days:[0,0,0,0,0], from:before,
      reason:why, kind:'exit', createdAt:new Date().toISOString() });
    const doPrintExit = m.querySelector('#oPrint').checked;
    closeModal(); commit();
    if(doPrintExit) printExitNotice([key], why, date);
    toast('已退出夜自習，並寫入異動日誌', 3200);
  });
}

function openExitBatch(keys){
  keys = (keys && keys.length) ? keys : [...ui.pick];
  if(!keys.length) return;
  const who = keys.map(function(k){
    const s = E.byKey(state,k);
    return s ? s.cls+'-'+s.seat+esc(s.name) : k;
  }).join('、');
  const body = '<div class="hint">一次退出 '+keys.length+' 人：'+who+'</div>'
    + '<div class="field"><label>生效日</label><input type="date" id="oDate" value="'+ref()+'"></div>'
    + '<div class="field"><label>退出原因（必填，套用到每個人）</label><input id="oWhy" placeholder="例如：本學期結束不再參加"></div>'
    + '<label class="chk"><input type="checkbox" id="oPrint"> 同時列印退班通知（每人一張，格式同違規通知單）</label>'
    + '<p class="hint">每個人都會在異動日誌留下一筆紀錄，座位一併釋出。</p>';
  const m = modal('批次退出夜自習', body, '<button class="btn" data-close>取消</button><button class="btn seal" id="oSave">確定退出</button>');
  m.querySelector('[data-close]').addEventListener('click', closeModal);
  m.querySelector('#oSave').addEventListener('click', function(){
    const why = m.querySelector('#oWhy').value.trim();
    if(!why){ toast('請填寫退出原因'); m.querySelector('#oWhy').focus(); return; }
    const date = m.querySelector('#oDate').value || ref();
    let n = 0;
    keys.forEach(function(k){
      const s = E.byKey(state,k); if(!s || s.active===false) return;
      const before = E.daysAt(state,k,date).slice();
      s.active = false;
      dropSeatOf(k);
      state.enrollments.push({ id:newId('e'), key:k, date:date, days:[0,0,0,0,0], from:before,
        reason:why, kind:'exit', createdAt:new Date().toISOString() });
      n++;
    });
    const doPrintExit = m.querySelector('#oPrint').checked;
    ui.pick.clear();
    closeModal(); commit();
    if(doPrintExit) printExitNotice(keys, why, date);
    toast('已退出 '+n+' 人，並寫入異動日誌', 3200);
  });
}

/* 同一張桌子的所有格：原本就拆兩格的桌子有兩個，其餘一個 */
function deskSlots(slot){
  const def = CONFIG.SEAT_SLOTS.find(function(s){ return s.i === Number(slot); });
  if(!def) return [];
  return CONFIG.SEAT_SLOTS.filter(function(s){ return s.band === def.band && s.col === def.col; })
    .sort(function(a,b){ return a.row - b.row; })
    .map(function(s){ return s.i; });
}
function deskBotKey(slot){
  const slots = deskSlots(slot);
  if(slots.length > 1) return state.seats[String(slots[1])] || '';
  return (state.seatPair || {})[String(slot)] || '';
}
function setDeskBot(slot, key){
  const slots = deskSlots(slot);
  if(slots.length > 1){
    if(key) state.seats[String(slots[1])] = key; else delete state.seats[String(slots[1])];
  }else{
    if(key) state.seatPair[String(slot)] = key; else delete state.seatPair[String(slot)];
  }
}

/* 座位上／下其中一位的內容 */
function seatPart(key, tag, dup, label){
  const s = key ? E.byKey(state,key) : null;
  if(!s) return '';
  return '<div class="part">'
    + (label ? '<span class="plab">'+label+(tag ? '<i>'+tag+'</i>' : '')+'</span>' : '')
    + '<div class="nm">'+esc(s.name)+(dup && dup.has(key) ? ' <span class="sub">重複</span>' : '')+'</div>'
    + '<div class="sub">'+s.cls+s.seat+'</div>'
    + '<div class="mn">'+E.daysNow(state,key).map(v=>v?'■':'□').join('')+'</div>'
    + '</div>';
}

function placeSeat(slot){
  const i = Number(slot);
  const idx = String(i);
  const top = state.seats[idx] || '';
  const bot = deskBotKey(i);
  if(!ui.sel){ if(top || bot) ui.sel = { kind:'slot', slot:i }; renderSeat(); return; }

  if(ui.sel.kind === 'slot'){
    const src = Number(ui.sel.slot);
    if(src === i){ ui.sel = null; renderSeat(); return; }
    const sTop = state.seats[String(src)] || '';
    const sBot = deskBotKey(src);
    if(sTop) state.seats[idx] = sTop; else delete state.seats[idx];
    setDeskBot(i, sBot);
    if(top) state.seats[String(src)] = top; else delete state.seats[String(src)];
    setDeskBot(src, bot);
    ui.sel = null; commit(); return;
  }

  const key = ui.sel.key;
  if(top === key || bot === key){ ui.sel = null; renderSeat(); return; }

  if(!top){
    state.seats[idx] = key;
  } else if(E.daysOverlap(state, top, key)){
    toast('這兩位同一天都要來，同一張桌子不能排在一起，請先調整其中一人的參加日', 5600);
    return;
  } else if(!bot){
    setDeskBot(i, key);
  } else if(E.daysOverlap(state, bot, key)){
    toast('這兩位同一天都要來，同一張桌子不能排在一起，請先調整其中一人的參加日', 5600);
    return;
  } else {
    setDeskBot(i, key);
  }
  ui.sel = null; commit();
}

function releaseSeat(slot, which){
  const i = Number(slot);
  const idx = String(i);
  const isBot = which === 'bottom';
  const top = state.seats[idx] || '';
  const bot = deskBotKey(i);
  const key = isBot ? bot : top;
  if(!key) return;
  const s = E.byKey(state,key);
  if(isBot){
    setDeskBot(i, '');
  }else{
    delete state.seats[idx];
    if(bot){ state.seats[idx] = bot; setDeskBot(i, ''); }
  }
  ui.sel = null;
  commit();
  toast((s ? s.name : '學生') + ' 已移出座位，回到尚未入座', 3200);
}

/* 異動日誌的純文字版：10/1 90201一二四改一二 */
function logPlainText(){
  const rows = E.recentLog(state).slice().sort(function(a,b){
    return a.date.localeCompare(b.date) || ((a.order||0) - (b.order||0));
  });
  return rows.map(function(e){
    const p = String(e.date).split('-');
    const dm = Number(p[1]) + '/' + Number(p[2]);
    const s = E.byKey(state, e.key);
    const who = (s ? s.cls : E.clsOf(e.key)) + (s ? s.seat : E.seatOf(e.key));
    const hasBefore = (e.before || []).some(Boolean);
    const hasAfter = (e.after || []).some(Boolean);
    if(!hasBefore && hasAfter) return dm + ' 新增' + who + E.label(e.after);
    if(hasBefore && !hasAfter) return dm + ' ' + who + E.label(e.before) + '改不參加';
    return dm + ' ' + who + E.label(e.before) + '改' + E.label(e.after);
  }).join('\n');
}

/* 複製到剪貼簿；非安全來源或瀏覽器不給權限時，開視窗讓老師自己選取 */
async function copyText(text, okMsg){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast(okMsg || '已複製', 2800);
  }catch(err){
    const m = modal('複製文字', '<p class="hint" style="margin:0 0 6px">瀏覽器不讓程式直接寫入剪貼簿，請按 Ctrl+C（手機長按）複製下面這段。</p>'
      + '<textarea class="copytxt" readonly>'+esc(text)+'</textarea>',
      '<button class="btn" data-close>關閉</button>', true);
    m.querySelector('[data-close]').addEventListener('click', closeModal);
    try{ m.querySelector('textarea').select(); }catch(err2){}
  }
}

/* ---------- 請假紀錄 ---------- */
function weekRange(iso){
  const d = E.parse(iso);
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay()+6)%7));
  const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+6);
  return [E.iso(monday), E.iso(sunday)];
}

function leaveList(){
  const iso = ref();
  const [mon, sun] = weekRange(iso);
  return (state.leaves||[]).slice()
    .sort((a,b)=> b.date.localeCompare(a.date) || a.key.localeCompare(b.key))
    .filter(function(l){
      if(ui.lvFilter==='today') return l.date===iso;
      if(ui.lvFilter==='week') return l.date>=mon && l.date<=sun;
      if(ui.lvFilter==='future') return l.date>=iso;
      return true;
    });
}

/* 每一頁幾筆：篩選一改就回第 1 頁；刪到最後一筆也不會停在空頁 */
const LEAVE_SIZES = [20, 50, 100];
function leavePageInfo(total){
  const size = Math.max(5, Number(ui.lvSize) || 20);
  const pages = Math.max(1, Math.ceil(total / size));
  const page = Math.min(Math.max(1, Number(ui.lvPage) || 1), pages);
  ui.lvPage = page;
  ui.lvSize = size;
  const from = (page - 1) * size;
  return { size:size, pages:pages, page:page, from:from,
    to:Math.min(total, from + size), total:total };
}

function renderLeavePager(pi){
  const el = $('leavePager');
  if(!el) return;
  el.innerHTML = '<span>第 <b>' + pi.page + '</b>／' + pi.pages + ' 頁　顯示 '
    + (pi.total ? (pi.from + 1) + '–' + pi.to : 0) + ' 筆，符合條件共 ' + pi.total + ' 筆</span>'
    + '<span class="spacer"></span>'
    + '<label for="lvSize">每頁</label>'
    + '<select id="lvSize">' + LEAVE_SIZES.map(function(n){
        return '<option value="' + n + '"' + (pi.size === n ? ' selected' : '') + '>' + n + ' 筆</option>';
      }).join('') + '</select>'
    + '<button class="btn tiny" data-lvpage="' + (pi.page - 1) + '"'
      + (pi.page <= 1 ? ' disabled aria-disabled="true"' : '') + '>‹ 上一頁</button>'
    + '<button class="btn tiny" data-lvpage="' + (pi.page + 1) + '"'
      + (pi.page >= pi.pages ? ' disabled aria-disabled="true"' : '') + '>下一頁 ›</button>';
}

/* 內文中的 90 開頭座號自動變成學生標記（只認已參加的學生） */
/* 標記本身已含姓名，緊接在後的同名文字去掉，避免重複 */
function dedupeName(text){
  const idx = {};
  E.active(state).forEach(s=>{ idx[s.cls+'-'+s.seat] = s; });
  return String(text||'').replace(/(90\d)-?(\d{2})[\s\u3000]*([^\s\u3000]{1,8})/g, function(all, a, b, tail){
    const s = idx[a+'-'+b];
    if(!s) return all;
    if(tail.indexOf(s.name) === 0) return a+'-'+b+' '+tail.slice(s.name.length);
    return all;
  });
}
function richHtml(text){
  const idx = {};
  E.active(state).forEach(s=>{ idx[s.cls+'-'+s.seat] = s; });
  return esc(dedupeName(text)).replace(/(90\d)-?(\d{2})/g, function(all, a, b){
    const s = idx[a+'-'+b];
    if(!s) return all;
    return '<span class="stu-tag" data-tag="'+a+'-'+b+'">'+esc(s.cls+'-'+s.seat+' '+s.name)+'</span>';
  });
}
/* 時間一律二十四小時制：只把格式補成 HH:MM（7:50 變 07:50），不再自作主張換算上下午 */
function twentyFour(t){
  const s = String(t==null ? '' : t).trim();
  const m = s.match(/^(\d{1,2})[:：](\d{1,2})$/);
  if(!m) return s;
  let h = Number(m[1]), mi = Number(m[2]);
  if(!isFinite(h) || !isFinite(mi)) return s;
  if(h > 23) h = 23;
  if(mi > 59) mi = 59;
  return (h < 10 ? '0' + h : String(h)) + ':' + (mi < 10 ? '0' + mi : String(mi));
}
/* 記事裡的「907-27 王小明」只是標記用，帶進違規事由時要拿掉，不然事由會重複班級座號與姓名 */
function stripStuPrefix(text, key, name){
  let s = String(text==null ? '' : text).replace(/<[^>]*>/g, ' ');
  const m = String(key==null ? '' : key).match(/^(\d{2,3})-(\d{2})$/);
  if(m){
    s = s.replace(new RegExp('^[\\s　]*' + m[1] + '[-－]?' + m[2] + '(?![0-9])'), ' ');
  }
  const nm = String(name==null ? '' : name).trim();
  if(nm){
    const escNm = nm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    s = s.replace(new RegExp('^[\\s　]*' + escNm), ' ');
  }
  s = s.replace(/^[\s　:：、,，。]+/, '');
  return s.trim();
}

  applyNoteDraftOnce();
  const rows = E.weekRows(state, iso);
  const mon = rows[0], sun = rows[4];
  const today = ref();
  const total = (state.dutyNotes||[]).filter(n=> n.date>=mon.date && n.date<=sun.date).length;
  $('dutyTools').innerHTML = '<button class="btn" id="weekPrev">上一週</button>'
    + '<button class="btn" id="weekNow">本週</button>'
    + '<button class="btn" id="weekNext">下一週</button>'
    + '<span class="hint">'+mon.date+' 至 '+sun.date+'　本週記事 '+total+' 筆；今天固定排在最上面可直接編輯，'
    + '其他日子按「編輯這天」才能改；輸入 90 開頭加座號會帶出學生。</span>';
  const order = rows.slice().sort(function(a, b){
    if(a.date === today && b.date !== today) return -1;
    if(b.date === today && a.date !== today) return 1;
    return a.date.localeCompare(b.date);
  });
  $('week').innerHTML = order.map(dayCard).join('');
}

/* 常用清單即時預覽：一眼看出會被切成幾個按鈕 */
function refreshOptPreviews(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-prev]'), function(box){
    const input = document.querySelector('[data-opt="'+box.dataset.prev+'"]');
    const list = String(input ? input.value : '').split(/[、；]/)
      .map(function(s){ return s.trim(); }).filter(Boolean);
    box.innerHTML = list.length
      ? '<span class="hint">會變成 '+list.length+' 個按鈕：</span> '
        + list.map(function(v){ return '<span class="pill">'+esc(v)+'</span>'; }).join(' ')
      : '<span class="hint">目前沒有項目</span>';
  });
}

/* ---------- 便當管理 ---------- */
function money(n){ return Number(n||0).toLocaleString('en-US'); }
/* 便當只分訂、不訂：舊資料的葷、素一律算「訂」 */
function lunchText(v){
  const t = String(v == null ? '' : v).trim();
  if(!t) return '';
  return t === '不訂' ? '不訂' : '訂';
}
/* 試算表讀回來的日期可能是 Date 或長字串，一律收成 YYYY-MM-DD */
function toIsoDate(v){
  const s = String(v == null ? '' : v).trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if(isNaN(d.getTime())) return '';
  const p = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function mealYm(){
  if(!ui.mealYm) ui.mealYm = E.meal.ym(ref());
  return ui.mealYm;
}
/* 身份標籤：月中退出的人這個月還在名單上，標出來才不會被當成漏填 */
function mealWho(m, full){
  if(!m) return '';
  if(m.group === '數學班') return full ? '數學班（每週一）' : '數學';
  if(m.active === false) return full ? '夜自習（本月已退出）' : '已退出';
  return '夜自習';
}
function mealCellText(d){
  if(d.mode === 'on') return '供餐';
  if(d.mode === 'add') return '加訂（計費）';
  if(d.mode === 'take') return '請假帶走（不退費）';
  if(d.mode === 'refund'){
    if(d.why === 'drop') return d.paid ? '月中變動，退費已退' : '月中退出或改時間，待退費';
    if(d.why === 'leave') return d.paid ? '請假，退費已退' : '請假，待退費';
    return d.paid ? '退費已退' : '退費待退';
  }
  return '不供餐';
}

function renderMealGrid(mo, pack){
  const st = state;
  const byKey = {};
  pack.rows.forEach(function(b){ byKey[b.key] = b; });
  const roster = E.meal.roster(st, mo.ym);
  const has = roster.some(function(m){ return !!byKey[m.key]; });

  /* 兩列表頭都用完整格數，不用 rowspan：Chrome 的 sticky 加 rowspan 會讓欄位對不齊 */
  let row1 = '<thead><tr><th class="cls">班級</th><th class="seat">座號</th>'
    + '<th class="name">姓名</th><th class="grp">身份</th>';
  let row2 = '<tr><th class="cls"></th><th class="seat"></th><th class="name"></th><th class="grp"></th>';
  mo.weeks.forEach(function(wk){
    wk.slots.forEach(function(sl){
      row1 += sl ? '<th class="' + (sl.holiday ? 'hl' : 'd') + '" title="' + sl.iso + '">'
        + sl.day + (sl.holiday ? '休' : '') + '</th>' : '<th class="we"></th>';
      row2 += '<th class="we">' + (sl ? CONFIG.WEEKDAY[sl.wd] : '') + '</th>';
    });
    row1 += '<th class="sub">小計</th>';
    row2 += '<th class="sub"></th>';
  });
  row1 += '<th class="total">實收金額</th><th class="total">待退</th>';
  row2 += '<th class="total"></th><th class="total"></th>';
  row2 += '</tr>';

  let body = '<tbody>';
  if(!has){
    body += '<tr><td colspan="' + (4 + mo.weeks.length * 6 + 2) + '" class="hint" style="text-align:left;padding:8px">'
      + '這個月還沒有人訂便當。請到「學生清單」把便當欄設成訂，或按「訂餐名單」新增數學班等額外訂餐者。</td></tr>';
  }
  let band = -1, lastCls = null;
  roster.forEach(function(m){
    const b = byKey[m.key];
    if(!b) return;
    if(m.cls !== lastCls){ band++; lastCls = m.cls; }
    body += '<tr' + (band % 2 ? ' class="band"' : '') + '>'
      + '<td class="cls">' + m.cls + '</td><td class="seat">' + esc(m.seat) + '</td>'
      + '<td class="name">' + esc(m.name) + '</td>'
      + '<td class="grp" title="' + esc(mealWho(m, true)) + '">' + mealWho(m, false) + '</td>';
    mo.weeks.forEach(function(wk){
      let weekServed = 0;
      wk.slots.forEach(function(sl){
        if(!sl){ body += '<td class="cell off"></td>'; return; }
        if(sl.holiday){ body += '<td class="cell holiday" title="' + sl.iso + ' 放假">—</td>'; return; }
        const d = E.meal.day(st, m, sl.iso);
        if(d.charge) weekServed++;
        const cls = d.mode === 'take' ? 'take' : (d.mode === 'add' ? 'add'
          : (d.mode === 'refund' ? (d.paid ? 'done' : 'refund')
            : (d.mode === 'on' ? 'on' : 'off')));
        body += '<td class="cell ' + cls + (d.manual ? ' fix' : '') + '"'
          + ' data-mealcell="' + m.key + '|' + sl.iso + '"'
          + ' title="' + sl.iso + '　' + mealCellText(d) + '">'
          + E.meal.cellText(st, m, sl.iso) + '</td>';
      });
      body += '<td class="sub">' + weekServed + '</td>';
    });
    body += '<td class="total">' + money(b.charge) + '</td>'
      + '<td class="wait">' + (b.waitN ? '<b data-mealmoneypay="' + m.key + '">' + b.waitN + ' 筆</b>' : '—') + '</td>'
      + '</tr>';
  });
  body += '</tbody>';
  /* 最後一列：每天的數量合計，跟表頭一樣固定 */
  let foot = '<tfoot><tr><th colspan="4" style="text-align:left;padding:0 8px">每日合計</th>';
  mo.weeks.forEach(function(wk){
    let weekSum = 0;
    wk.slots.forEach(function(sl){
      let n = 0;
      if(sl && !sl.holiday){
        roster.forEach(function(m){
          if(byKey[m.key] && E.meal.day(st, m, sl.iso).charge) n++;
        });
      }
      weekSum += n;
      foot += '<td class="sum">' + (sl ? (sl.holiday ? '—' : (n || '—')) : '') + '</td>';
    });
    foot += '<td class="sum sub">' + (weekSum || '—') + '</td>';
  });
  foot += '<td class="sum total">' + money(pack.sum.net) + '</td>'
    + '<td class="sum wait">' + (pack.sum.waitN || '—') + '</td></tr></tfoot>';
  $('mealGrid').innerHTML = row1 + row2 + body + foot;
}

/* 本期調整：整體加收、整體退費、折抵下期 */
function mealAdjustsHtml(ym){
  const list = E.meal.adjusts(state, ym);
  const scopeText = function(a){
    if(a.scope === 'day') return (a.day || '') + ' 有餐的人';
    if(a.scope === 'keys') return (a.keys || []).length + ' 人';
    return '這期所有人';
  };
  return '<div class="meal-h3"><h3>本期調整（' + list.length + ' 筆）</h3>'
    + '<button class="btn tiny" id="btnMealAdjust">新增調整</button>'
    + '<span class="hint">颱風假、臨時加菜、補收都用這裡；折抵的會出現在下期帳單</span></div>'
    + (list.length ? list.map(function(a){
        return '<div class="row">'
          + '<span class="who">' + (a.amount > 0 ? '加收 ' : '退費 ') + Math.abs(a.amount) + ' 元</span>'
          + '<span>' + esc(scopeText(a)) + '</span>'
          + '<span class="why">' + esc(a.note || '') + '</span>'
          + '<span>' + (a.settle === 'carry' ? '折抵下期' : '現金') + '</span>'
          + '<span class="btns"><button class="btn tiny" data-mealdeladj="' + a.id + '">刪除</button></span>'
          + '</div>';
      }).join('') : '<p class="hint">這一期還沒有調整</p>');
}

function renderMealPending(ym){
  const list = E.meal.pending(state, ym);
  const price = E.meal.price(state);
  /* 預設收合；開合狀態存在這台裝置，下次進來照上次的樣子 */
  const open = ui.mealNoticeOpen === true;
  /* 勾選狀態放 ui，重畫或點帶走都不會掉；已經不在清單裡的勾選自動清掉 */
  ui.pendPick = ui.pendPick || {};
  const alive = {};
  list.forEach(function(p){ alive[p.member.key + '|' + p.iso] = 1; });
  Object.keys(ui.pendPick).forEach(function(k){ if(!alive[k]) delete ui.pendPick[k]; });
  const picked = Object.keys(ui.pendPick).length;
  /* 待處理退費放在統計表上方，做成可以收合的通知框，方便隨時追 */
  $('mealNotice').innerHTML = list.length
    ? '<div class="meal-notice">'
      + '<div class="mn-h">'
      +   '<b>待處理退費 ' + list.length + ' 筆</b>'
      +   '<span class="mn-money">共 ' + money(list.length * price) + ' 元</span>'
      +   '<button class="btn tiny seal" id="btnMealPayAll">全月標記已退</button>'
      +   '<span class="spacer"></span>'
      +   '<button class="btn tiny" data-mealnotice="toggle">' + (open ? '收起' : '展開') + '</button>'
      + '</div>'
      + (open
          ? '<div class="mn-b">'
            + '<div class="mn-tools">'
            +   '<label class="chk-inline"><input type="checkbox" data-pendall'
            +     (picked && picked === list.length ? ' checked' : '') + '> 全選</label>'
            +   '<button class="btn tiny seal" id="btnMealPayPick"' + (picked ? '' : ' disabled')
            +     '>退費勾選 ' + picked + ' 筆</button>'
            + '</div>'
            + list.map(function(p){
              const id = p.member.key + '|' + p.iso;
              return '<div class="row">'
                + '<input type="checkbox" class="pendpick" data-pendpick="' + id + '"'
                +   (ui.pendPick[id] ? ' checked' : '') + '>'
                + '<span class="who">' + p.member.cls + '-' + esc(p.member.seat) + '　' + esc(p.member.name) + '</span>'
                + '<span>' + p.iso + '（' + CONFIG.WEEKDAY[E.wd(p.iso)] + '）</span>'
                + '<span class="why">' + esc(p.why) + '</span>'
                + '<span class="btns">'
                +   '<button class="btn tiny" data-mealtake="' + id + '">帶走</button>'
                + '</span></div>';
            }).join('')
            + '</div>'
          : '')
      + '</div>'
    : '';
  $('mealPending').innerHTML = mealAdjustsHtml(ym);
}

/* 點格子：1 → V → 空白 → 回到自動判定 */
function cycleMealCell(key, iso){
  const member = E.meal.byKey(state, key, E.meal.ym(iso));
  if(!member) return;
  const d = E.meal.day(state, member, iso);
  const cur = d.charge ? (d.mode === 'take' ? 'V' : '1') : '';
  const next = cur === '1' ? 'V' : (cur === 'V' ? '' : '1');
  state.meals = (state.meals||[]).filter(function(m){ return !(m.key === key && m.date === iso); });
  if(next === '1'){
    state.meals.push({ id:newId('m'), date:iso, key:key, kind:'加訂', status:'', paidAt:'', note:'手動指定供餐' });
  }else if(next === 'V'){
    state.meals.push({ id:newId('m'), date:iso, key:key, kind:'帶走', status:'', paidAt:'', note:'請假帶走' });
  }else if(E.meal.planned(state, member, iso)){
    state.meals.push({ id:newId('m'), date:iso, key:key, kind:'退費', status:'待退', paidAt:'', note:'手動退費' });
  }
  commit();
}

/* 把某一天的退費標成已退／待退；回傳有沒有改到 */
function mealSetPaid(key, iso, paid){
  let r = E.meal.rec(state, key, iso);
  if(!r){
    r = { id:newId('m'), date:iso, key:key, kind:'退費', status:'待退', paidAt:'', note:'請假退費' };
    state.meals.push(r);
  }
  if(r.kind === '帶走' || r.kind === '加訂') return false;
  r.status = paid ? '已退' : '待退';
  r.paidAt = paid ? E.today() : '';
  return true;
}

function mealPayAll(ym){
  const list = E.meal.pending(state, ym);
  if(!list.length){ toast('這個月沒有待處理的退費'); return; }
  const total = list.length * E.meal.price(state);
  confirmModal('整月標記已退',
    '共 ' + list.length + ' 筆、' + total + ' 元，確定全部標成「已退」嗎？',
    function(){
      list.forEach(function(p){ mealSetPaid(p.member.key, p.iso, true); });
      commit();
      toast('已標記 ' + list.length + ' 筆退費');
    }, '全部已退');
}

/* 勾選幾筆就退幾筆：一次 commit，只跳一次提示 */
function mealPayPick(ym){
  const ids = Object.keys(ui.pendPick || {});
  if(!ids.length){ toast('先勾選要退的筆數'); return; }
  const price = E.meal.price(state);
  confirmModal('標記已退',
    '勾選的 ' + ids.length + ' 筆、共 ' + money(ids.length * price) + ' 元，確定標成「已退」嗎？',
    function(){
      let n = 0;
      ids.forEach(function(id){
        const p = id.split('|');
        if(mealSetPaid(p[0], p[1], true)) n++;
      });
      ui.pendPick = {};
      commit();
      toast('已標記 ' + n + ' 筆退費');
    }, '標記已退');
}

/* 勾選變動時只更新按鈕與全選狀態，不重畫整塊，避免畫面跳動 */
function syncPendPick(){
  const n = Object.keys(ui.pendPick || {}).length;
  const btn = $('btnMealPayPick');
  if(btn){
    btn.disabled = !n;
    btn.textContent = '退費勾選 ' + n + ' 筆';
  }
  const all = document.querySelector('[data-pendall]');
  if(all){

    all.checked = boxes.length > 0 && n === boxes.length;

/* 從學生名單挑人加入便當名單：可批次、可篩班級與座號 */
function openMealMemberPick(){
  const st = state;
  const inList = {}, ordering = {};
  (st.mealMembers||[]).forEach(function(x){ inList[x.key] = true; });
  E.meal.roster(st, mealYm()).forEach(function(x){ ordering[x.key] = true; });
  const classes = E.classes(st);
  const pick = new Set();
  let cls = 0, q = '';

  const body = '<div class="tools" id="mpickBar"></div>'
    + '<div class="tablewrap" id="mpickTable" style="max-height:46vh;overflow:auto"></div>'
    + '<div class="tools" style="margin-top:10px">'
    +   '<label class="hint" style="margin:0">開始日</label>'
    +   '<input type="date" id="mpickFrom" class="btn" style="min-height:40px">'
    +   '<input id="mpickNote" placeholder="備註（例如：每週一數學班）" style="flex:1 1 200px;min-height:40px">'
    + '</div>'
    + '<p class="hint">勾選後按「加入」，一次可以加很多人；開始日留空表示不限。</p>';
  const m = modal('從學生名單加入便當名單', body,
    '<button class="btn" data-close>取消</button><button class="btn primary" id="mpickGo">加入</button>', true);
  m.querySelector('[data-close]').addEventListener('click', closeModal);

  function rows(){
    return (st.students||[]).filter(function(s){
      if(cls && Number(s.cls) !== cls) return false;
      const kw = q.trim();
      if(kw && String(s.seat).indexOf(kw) !== 0 && String(s.name).indexOf(kw) < 0) return false;
      return true;
    }).sort(function(a,b){
      return (Number(a.cls) - Number(b.cls)) || String(a.seat).localeCompare(String(b.seat));
    });
  }
  function draw(){
    m.querySelector('#mpickBar').innerHTML = '<div class="chips">'
      + '<button class="chip' + (cls === 0 ? ' sel' : '') + '" data-mpickcls="0">全部</button>'
      + classes.map(function(c){
          return '<button class="chip' + (cls === c ? ' sel' : '') + '" data-mpickcls="' + c + '">' + c + '</button>';
        }).join('')
      + '</div>'
      + '<input id="mpickQ" placeholder="搜尋座號或姓名" value="' + esc(q) + '" style="min-width:150px;min-height:40px">'
      + '<button class="btn tiny" id="mpickAll">全選</button>'
      + '<button class="btn tiny" id="mpickNone">取消全選</button>'
      + '<span class="hint">已勾 ' + pick.size + ' 人</span>';
    const list = rows();
    m.querySelector('#mpickTable').innerHTML = '<table class="data"><thead><tr>'
      + '<th style="width:44px"></th><th>班級</th><th>座號</th><th>姓名</th><th>目前</th>'
      + '</tr></thead><tbody>'
      + (list.length ? list.map(function(s){
          const added = inList[s.key] || ordering[s.key];
          const now = ordering[s.key] ? '訂餐中'
            : (inList[s.key] ? '已在便當名單' : (lunchText(s.lunch) === '不訂' ? '不訂' : '訂'));
          return '<tr><td><input type="checkbox" data-mpick="' + s.key + '"'
            + (added ? ' disabled' : (pick.has(s.key) ? ' checked' : '')) + '></td>'
            + '<td>' + s.cls + '</td><td>' + esc(s.seat) + '</td><td>' + esc(s.name) + '</td>'
            + '<td>' + (added ? '<span class="pill">' + now + '</span>' : now) + '</td></tr>';
        }).join('') : '<tr><td colspan="5" class="hint">沒有符合的學生</td></tr>')
      + '</tbody></table>';
  }
  draw();

  m.addEventListener('click', function(ev){
    const c = ev.target.closest('[data-mpickcls]');
    if(c){ cls = Number(c.dataset.mpickcls); draw(); return; }
    if(ev.target.id === 'mpickAll'){
      rows().forEach(function(s){ if(!inList[s.key] && !ordering[s.key]) pick.add(s.key); });
      draw(); return;
    }
    if(ev.target.id === 'mpickNone'){ pick.clear(); draw(); return; }
  });
  m.addEventListener('input', function(ev){
    if(ev.target.id !== 'mpickQ') return;
    q = ev.target.value;
    draw();
    const el = m.querySelector('#mpickQ');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  m.addEventListener('change', function(ev){
    const cb = ev.target.closest('[data-mpick]');
    if(!cb) return;
    if(cb.checked) pick.add(cb.dataset.mpick); else pick.delete(cb.dataset.mpick);
    const hint = m.querySelector('#mpickBar .hint');
    if(hint) hint.textContent = '已勾 ' + pick.size + ' 人';
  });
  m.querySelector('#mpickGo').addEventListener('click', function(){
    if(!pick.size){ toast('請先勾選學生'); return; }
    const from = m.querySelector('#mpickFrom').value;
    const note = m.querySelector('#mpickNote').value.trim();
    let n = 0;
    pick.forEach(function(k){
      const s = E.byKey(st, k); if(!s) return;
      if((st.mealMembers||[]).some(function(x){ return x.key === k; })) return;
      st.mealMembers.push({ key:k, cls:s.cls, seat:s.seat, name:s.name, lunch:'訂', from:from, note:note });
      n++;
    });
    closeModal(); commit();
    toast('已加入 ' + n + ' 位訂餐者');
  });
}

  const rec = (state.mealMembers||[]).find(function(x){ return x.key === key; })
    || { cls:'', seat:'', name:'', lunch:'', note:'' };

  const m = modal(key ? '編輯訂餐者' : '新增訂餐者', body,
    '<button class="btn" data-close>取消</button><button class="btn primary" id="mbrSave">儲存</button>');
  m.querySelector('[data-close]').addEventListener('click', closeModal);
  m.querySelector('#mbrSave').addEventListener('click', function(){
    const cls = Number(m.querySelector('#mbrCls').value);
    const seat = String(m.querySelector('#mbrSeat').value || '').trim();
    const name = m.querySelector('#mbrName').value.trim();
    const lunch = '訂';   /* 便當名單的人一定是訂 */
    const from = m.querySelector('#mbrFrom').value;
    const note = m.querySelector('#mbrNote').value.trim();
    if(!cls || !seat || !name){ toast('班級、座號、姓名都要填'); return; }
    const newKey = key || mealMemberKey(cls, seat, key);
    if(key){
      const rec2 = (state.mealMembers||[]).find(function(x){ return x.key === key; });
      if(!rec2) return;
      rec2.cls = cls; rec2.seat = seat; rec2.name = name; rec2.lunch = lunch;
      rec2.from = from; rec2.note = note;
    }else{
      state.mealMembers.push({ key:newKey, cls:cls, seat:seat, name:name, lunch:lunch, from:from, note:note });

    closeModal();
    commit();
    toast(key ? '已更新訂餐者' : '已新增訂餐者');
  });
}

    const keys = scope === 'keys'
      ? Array.prototype.filter.call(m.querySelector('#maKeys').options, function(o){ return o.selected; })
          .map(function(o){ return o.value; })

    });

function mealMemberKey(cls, seat, selfKey){
  let key = 'x' + cls + '-' + String(seat||'').padStart(2,'0');
  const used = (state.mealMembers||[]).some(function(x){ return x.key === key && x.key !== selfKey; });
  if(used) key += '-' + Math.random().toString(36).slice(2,5);
  return key;
}

document.addEventListener('click', e=>{

    const blocked = e.target.closest('[data-toggle],[data-batch],[data-pickall],[data-day][data-key],[data-slot],[data-un],#btnAutoSeat,#btnClearSeat,#btnSeatOut,#btnSeatOutBot');
    if(blocked) return;
  }
  // 今夜點名
  /* 點右上角「輪值教師」標記＝切換身分（不再另設按鈕） */
  if(e.target.id==='roleTag'){
    ROLE = 'admin';
    localStorage.removeItem(CONFIG.ROLE_KEY);
    CONFIG.PASSWORD = '';
    if($('cfgPwd')) $('cfgPwd').value = '';
    applyRole(); renderMemoState(); render();
    showGate('請輸入管理密語切換回管理員，或輸入教師密語繼續以教師身分使用。');
    return;
  }
  if(e.target.id==='dayPrev' || e.target.id==='dayNext'){
    /* 前後日直接跳到最近一個有排夜自習的日期，週末、放假、沒排人的日子都跳過 */
    const dir = e.target.id==='dayPrev' ? -1 : 1;
    const next = E.stepScheduled(state, ref(), dir, 120);
    if(!next){
      toast(dir < 0 ? '往前已經沒有排定的夜自習日' : '往後已經沒有排定的夜自習日', 3600);
      return;
    }
    state.config.refDate = next;
    ui.weekRef = next;
    commit();
    return;
  }
  if(e.target.id==='btnAllIn'){ allIn(); return; }
  if(e.target.id==='btnAllClear'){ clearCheckin(); return; }
  const mk = e.target.closest('[data-day]');
  if(mk){ openEnroll(mk.dataset.key, Number(mk.dataset.day)); return; }
  const ck = e.target.closest('[data-ck]');
  if(ck){ toggleCheckin(ck.dataset.ck); return; }
  const pa = e.target.closest('[data-pickall]');
  if(pa){
    if(pa.dataset.pickall === '1') listRows().forEach(function(s){ ui.pick.add(s.key); });
    else ui.pick.clear();
    renderListBody(); return;
  }
  const pick = e.target.closest('[data-pick]');
  if(pick){ if(pick.checked) ui.pick.add(pick.dataset.pick); else ui.pick.delete(pick.dataset.pick); renderListBatch(); return; }
  if(e.target.id==='pickAll'){
    const shown = listRows();
    shown.forEach(s=>{ if(e.target.checked) ui.pick.add(s.key); else ui.pick.delete(s.key); });
    document.querySelectorAll('#listTable [data-pick]').forEach(cb=>{ cb.checked = ui.pick.has(cb.dataset.pick); });
    renderListBatch(); return;
  }
  const tg = e.target.closest('[data-toggle]');
  if(tg){ const s0 = E.byKey(state, tg.dataset.toggle); setActive(tg.dataset.toggle, !(s0 && s0.active!==false)); return; }
  const cbox = e.target.closest('label.cbox');
  if(cbox && e.target.tagName !== 'INPUT') return;
  const stu = e.target.closest('[data-stu]');
  if(stu){ openStudent(stu.dataset.stu); return; }
  // 座位
  const seat = e.target.closest('[data-slot]');
  if(seat){ placeSeat(Number(seat.dataset.slot)); return; }
  if(e.target.id==='btnSeatOut'){ const sl = ui.sel && ui.sel.kind==='slot' ? ui.sel.slot : 0; if(sl) releaseSeat(sl); return; }
  if(e.target.id==='btnSeatOutBot'){ const sl = ui.sel && ui.sel.kind==='slot' ? ui.sel.slot : 0; if(sl) releaseSeat(sl, 'bottom'); return; }
  if(e.target.id==='btnSeatCancel'){ ui.sel = null; renderSeat(); return; }
  const un = e.target.closest('[data-un]');
  if(un){ ui.sel = (ui.sel && ui.sel.kind==='stu' && ui.sel.key===un.dataset.un) ? null : { kind:'stu', key:un.dataset.un }; renderSeat(); return; }
  if(e.target.id==='btnAutoSeat'){ autoSeat(); return; }
  if(e.target.id==='btnClearSeat'){ state.seats={}; ui.sel=null; commit(); return; }
  // 異動
  if(e.target.id==='btnNewEnroll'){ openEnrollPicker(); return; }
  if(e.target.id==='btnLogLinePng'){ exportRosterPng(); return; }
  if(e.target.id==='btnCopyLog'){ copyText(logPlainText(), '已複製 '+E.recentLog(state).length+' 筆異動文字'); return; }
  const eEdit = e.target.closest('[data-edit]');
  if(eEdit){ openEditEnroll(eEdit.dataset.edit); return; }
  const eDel = e.target.closest('[data-del]');
  if(eDel){ deleteEnroll(eDel.dataset.del); return; }
  // 違規
  if(e.target.id==='btnAddVio'){ openNewVio(); return; }
  if(e.target.id==='btnPrintVio'){ printVio(); return; }
  if(e.target.id==='btnExportVio'){ exportVio(ui.vioSel.size?[...ui.vioSel]:(state.violations||[]).map(v=>v.id)); return; }
  const vb = e.target.closest('[data-vio]');
  if(vb && vb.type==='checkbox'){ if(vb.checked) ui.vioSel.add(vb.dataset.vio); else ui.vioSel.delete(vb.dataset.vio); return; }
  const dv = e.target.closest('[data-delvio]');
  if(dv){ state.violations = state.violations.filter(v=>v.id!==dv.dataset.delvio); ui.vioSel.delete(dv.dataset.delvio); commit(); return; }
  const xv = e.target.closest('[data-exitnotice]');
  if(xv){ openExitNotice(xv.dataset.exitnotice); return; }
  const ev = e.target.closest('[data-editvio]');
  if(ev){ openVioForm(ev.dataset.editvio); return; }
  // 輪值
  if(e.target.id==='weekPrev'||e.target.id==='weekNext'||e.target.id==='weekNow'){
    const base = ui.weekRef || ref();
    const d = E.parse(base);
    const delta = e.target.id==='weekPrev' ? -7 : (e.target.id==='weekNext' ? 7 : 0);
    if(e.target.id==='weekNow'){ ui.weekRef = ref(); } else { ui.weekRef = E.iso(new Date(d.getFullYear(), d.getMonth(), d.getDate()+delta)); }
    renderDuty(); return;
  }
  // 匯出
  if(e.target.id==='btnPickTpl'){ $('tplPicker').click(); return; }
  if(e.target.id==='expXlsx'){ exportXlsx(); return; }
  if(e.target.id==='expSeat'){ exportSeat(); return; }
  if(e.target.id==='btnPrintSeat'){ printSeat(); return; }
  if(e.target.id==='expPrintList'){ printList(); return; }
  if(e.target.id==='expLinePng'){ exportRosterPng(); return; }
  if(e.target.id==='expVio'){ exportVio((state.violations||[]).map(v=>v.id)); return; }
  if(e.target.id==='expBackup'){ download(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}), '夜自習備份_'+stamp()+'.json'); return; }
  // 設定
  if(e.target.id==='btnSaveCfg'){ saveCfg(); return; }
  if(e.target.id==='btnReload' || e.target.closest('[data-reloadcloud]')){ reloadCloud(e.target); return; }
  if(e.target.id==='btnForgetPwd'){
    GATE.forget();
    localStorage.removeItem(CONFIG.ROLE_KEY);
    CONFIG.PASSWORD = '';
    if($('cfgPwd')) $('cfgPwd').value = '';
    renderMemoState();
    toast('已清除這台裝置記住的密語，下次開網頁要重新輸入', 4600);
    return;
  }
  if(e.target.id==='btnTeacherClear'){
    const adminPwd = CONFIG.PASSWORD;
    if(!API.reachable() || !adminPwd){ toast('要連上雲端才能改試算表裡的密語', 5200); return; }
    API.call({ action:'setPasswords', admin:adminPwd, teacher:'' }).then(function(res){
      if(res && res.ok){ cloud.hasTeacher = false; toast('已清除輪值教師密語，之後只有管理密語能登入', 4600); }
      else toast('沒有清除：' + ((res && res.error) || '請確認後端已更新'), 6000);
      renderMemoState();
    }).catch(function(err){ toast('沒有清除：' + err.message, 6000); });
    return;
  }
  if(e.target.id==='btnTest'){ selfTest(); return; }
  if(e.target.id==='btnImport'){ $('backupPicker').click(); return; }
});

/* ---------- 輪值記事：逐筆登記，儲存後再以呈現樣式顯示 ---------- */
function noteById(id){ return (state.dutyNotes||[]).find(n=>n.id===id); }

function startNote(date){
  if(ui.editNote) cancelNote(ui.editNote);
  const rec = { id:newId('dn'), date:date, time:nowTime(), text:'', key:'' };
  state.dutyNotes.push(rec);
  ui.editNote = rec.id;
  ui.noteDraft = { isNew:true, time:rec.time, text:'' };
  render();
  setTimeout(function(){
    const el = document.querySelector('[data-ntext="'+rec.id+'"]');
    if(el) el.focus();
  }, 40);
}
function focusNoteText(id){
  setTimeout(function(){
    const el = document.querySelector('[data-ntext="'+id+'"]');
    if(el) el.focus();
  }, 40);
}
function saveNote(id){
  const n = noteById(id); if(!n) return;
  const box = document.querySelector('[data-nid="'+id+'"]');
  if(!box) return;
  const timeEl = box.querySelector('[data-ntime]');
  const textEl = box.querySelector('[data-ntext]');
  if(timeEl) n.time = twentyFour(timeEl.value);
  if(textEl) n.text = dedupeName(textEl.innerText.replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim()).trim();
  hideStuPop();
  ui.editNote = null; ui.noteDraft = null;
  clearNoteDraft();
  commit();
  toast('記事已儲存');
}
function cancelNote(id){
  const n = noteById(id); if(!n) return;
  const d = ui.noteDraft || {};
  if(d.isNew){ state.dutyNotes = (state.dutyNotes||[]).filter(x=>x.id!==id); }
  else { n.time = d.time || ''; n.text = d.text || ''; }
  ui.editNote = null; ui.noteDraft = null;
  clearNoteDraft();
  render();
}
function editNote(id){
  const n = noteById(id); if(!n) return;
  if(ui.editNote && ui.editNote !== id) cancelNote(ui.editNote);
  ui.editNote = id;
  ui.noteDraft = { isNew:false, time:n.time||'', text:n.text||'' };
  render();
  focusNoteText(id);
}

/* 未送出的日誌草稿存在這台裝置，重整不會不見；按「儲存」送出或按「取消」清掉才會消失 */
const DRAFT_KEY = 'nightstudy.notedraft';
function readNoteDraft(){
  try{ const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); return (d && d.id) ? d : null; }catch(err){ return null; }
}
function writeNoteDraft(d){
  try{
    if(d && d.id) localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
    else localStorage.removeItem(DRAFT_KEY);
  }catch(err){}
}
function clearNoteDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(err){} }
/* 把畫面上正在編輯的那一則寫進本機草稿 */
function persistNoteDraft(){
  const box = document.querySelector('.nt-edit [data-ntext]');
  if(!box) return;
  const wrap = box.closest('.nt-edit');
  const t = wrap && wrap.querySelector('[data-ntime]');
  const id = box.dataset.ntext;
  const rec = noteById(id) || {};
  writeNoteDraft({
    id: id,
    date: rec.date || ref(),
    time: t ? twentyFour(t.value) : '',
    text: String(box.innerText || '').replace(/\u00a0/g, ' '),
    isNew: ui.noteDraft ? !!ui.noteDraft.isNew : !rec.id
  });
}
/* 開頁或重畫時把草稿接回來（只做一次） */
function applyNoteDraftOnce(){
  if(ui.draftApplied) return;
  ui.draftApplied = true;
  const d = readNoteDraft();
  if(!d) return;
  let rec = (state.dutyNotes || []).find(function(x){ return x.id === d.id; });
  if(!rec){
    rec = { id:d.id, date:d.date || ref(), time:d.time || '', text:'', key:'' };
    state.dutyNotes.push(rec);
  }
  if(d.time) rec.time = d.time;
  if(d.text) rec.text = d.text;
  ui.editNote = d.id;
  ui.noteDraft = { isNew: !!d.isNew, time: rec.time || '', text: rec.text || '' };
}
document.addEventListener('input', function(e){
  if(e.target && e.target.closest && e.target.closest('.nt-edit')) persistNoteDraft();
});
document.addEventListener('change', function(e){
  if(e.target && e.target.closest && e.target.closest('.nt-edit')) persistNoteDraft();
});

    return;
  }
});

/* 輸入 90 開頭跳出學生選單，選了才變成標記 */
let stuPop = null;
function hideStuPop(){ if(stuPop){ stuPop.remove(); stuPop = null; } }
function applyTagToNote(nid, key){
  const box = document.querySelector('[data-ntext="'+nid+'"]');
  const s = E.byKey(state, key);
  if(!box || !s) return;
  const plain = box.innerText.replace(/\u00a0/g,' ');
  const m = plain.match(/(90\d{0,3})\s*$/);
  const head = m ? plain.slice(0, m.index) : plain;
  box.innerHTML = richHtml(head + s.cls + s.seat + ' ');
  const r = document.createRange();
  r.selectNodeContents(box);
  r.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
  box.focus();
}
function showStuPop(box, rows){
  hideStuPop();
  const p = document.createElement('div');
  p.className = 'stu-pop';
  p.dataset.nid = box.dataset.ntext;
  p.innerHTML = rows.map(function(s){
    return '<button data-stupick="'+s.key+'">'+s.cls+'-'+s.seat+'　'+esc(s.name)+'</button>';
  }).join('');
  document.body.appendChild(p);
  stuPop = p;
  const rect = box.getBoundingClientRect();
  const w = p.offsetWidth;
  p.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, rect.left + 12)) + 'px';
  p.style.top = (rect.bottom + window.scrollY - 8) + 'px';
}
document.addEventListener('input', e=>{
  const box = e.target.closest('[data-ntext]');
  if(!box) return;
  const plain = box.innerText.replace(/\u00a0/g,' ');
  const m = plain.match(/(90\d{1,3})\s*$/);
  if(!m){ hideStuPop(); return; }
  const digits = m[1];
  const rows = E.active(state)
    .filter(s=> (String(s.cls)+s.seat).indexOf(digits)===0)
    .sort((a,b)=> a.cls-b.cls || a.seat.localeCompare(b.seat))
    .slice(0,6);
  if(!rows.length){ hideStuPop(); return; }
  const exact = (digits.length === 5) ? rows.filter(s=> (String(s.cls)+s.seat)===digits)[0] : null;
  if(exact){ hideStuPop(); applyTagToNote(box.dataset.ntext, exact.key); return; }
  showStuPop(box, rows);
});
document.addEventListener('mousedown', e=>{
  if(e.target.closest('.stu-pop')) e.preventDefault();
});
document.addEventListener('click', e=>{
  const pick = e.target.closest('[data-stupick]');
  if(pick){
    const nid = stuPop ? stuPop.dataset.nid : '';
    const key = pick.dataset.stupick;
    hideStuPop();
    applyTagToNote(nid, key);
    return;
  }
  if(!e.target.closest('.stu-pop')) hideStuPop();

/* ---------- 動作 ---------- */
function allIn(){
  const iso = ref();
  const b = E.board(state, iso);
  b.should.filter(s=>!E.onLeave(state,s.key,iso)).forEach(s=>{
    const c = state.checkins.find(x=>x.key===s.key && x.date===iso);
    if(c) c.status='到'; else state.checkins.push({ date:iso, key:s.key, status:'到' });
  });
  commit();
  toast('今夜 '+b.should.length+' 人全部標記到班');
}
function clearCheckin(){
  const iso = ref();
  state.checkins = state.checkins.filter(c=>c.date!==iso);
  commit(); toast('已清除今夜點名');
}
function toggleCheckin(key){
  const iso = ref();
  if(!E.present(state,key,iso)) return;
  const leave = (state.leaves||[]).find(l=>l.key===key && l.date===iso);
  const c = state.checkins.find(x=>x.key===key && x.date===iso);
  if(leave){
    /* 目前是假：點一下取消請假（點名紀錄一起清掉） */
    state.leaves = state.leaves.filter(l=>l!==leave);
    state.checkins = state.checkins.filter(x=>!(x.key===key && x.date===iso));
    commit();
  } else if(!c){
    /* 未 → 到 */
    state.checkins.push({ date:iso, key, status:'到' });
    commit();
  } else {
    /* 到 → 假：先問事由，確定才寫入 */
    openLeaveReason(key, iso);
  }
}
function autoSeat(){
  const list = E.active(state).slice().sort((a,b)=> a.cls-b.cls || a.seat.localeCompare(b.seat));
  const seats = {}, pair = {};
  const primaries = [];
  [1,2,3].forEach(function(b){
    for(let col = 1; col <= 14; col++){
      const d = CONFIG.SEAT_SLOTS.filter(function(s){ return s.band === b && s.col === col; }).sort(function(x,y){ return x.row - y.row; });
      if(d.length) primaries.push(d[0].i);
    }
  });
  let i = 0;
  primaries.forEach(function(p){ if(list[i]){ seats[String(p)] = list[i].key; i++; } });
  let j = i;
  primaries.forEach(function(p){
    if(j >= list.length) return;
    const top = seats[String(p)];
    if(!top) return;
    for(let t = j; t < list.length; t++){
      if(!E.daysOverlap(state, top, list[t].key)){ pair[String(p)] = list[t].key; j = t + 1; break; }
    }
  });
  state.seats = seats;
  state.seatPair = pair;
  ui.sel = null;
  commit();
  const n = Object.keys(seats).length + Object.keys(pair).length;
  toast('已排入 '+n+' 人'+(Object.keys(pair).length ? '（其中 '+Object.keys(pair).length+' 人與別人共用桌子）' : ''));
}

function openVioForm(id, pre){
  pre = pre || {};
  const rec = id ? (state.violations||[]).find(v=>v.id===id) : null;
  const pickKey = rec ? rec.key : (pre.key || '');
  const list = E.active(state).slice().sort((a,b)=> a.cls-b.cls || a.seat.localeCompare(b.seat));
  if(pickKey && !list.some(s=>s.key===pickKey)){
    const s = E.byKey(state, pickKey);

  }
  const selKey = pickKey || (list[0] ? list[0].key : '');
  const opts = list.map(s=>'<option value="'+s.key+'"'+(s.key===selKey?' selected':'')+'>'+s.cls+'-'+s.seat+' '+esc(s.name)+'</option>').join('');
  const theDate = rec ? rec.date : (pre.date || ref());
  const lim = E.optNum(state,'vioLimit');
  const chips = E.optList(state,'vioReasons').map(function(v){
    return '<button type="button" class="btn small" data-fill="'+esc(v)+'">'+esc(v)+'</button>';
  }).join(' ');
  const body = '<div class="field"><label>學生</label><select id="vk">'+opts+'</select></div>'
    + '<div class="field"><label>日期</label><input type="date" id="vd" value="'+theDate+'"></div>'
    + '<div class="field"><label>違規點數（滿 '+lim+' 點依規定退班）</label><input type="number" id="vp" min="1" max="9" step="1" value="'+(rec ? (Number(rec.points)||1) : 1)+'"></div>'
    + '<div class="field"><label>事由</label><textarea id="vr" rows="3" placeholder="例如：夜自習期間違規（打瞌睡，多次提醒）"></textarea>'
    + (chips ? '<div class="tools" style="margin-top:6px;flex-wrap:wrap">'+chips+'</div>' : '')
    + '</div>'
    + '<p class="hint">列印與下載時會自動在事由後面加上「（記O點）」。</p>';
  const m = modal(rec ? '編輯違規紀錄' : '新增違規紀錄', body,
    '<button class="btn" data-close>取消</button><button class="btn primary" id="vSave">儲存</button>');
  m.querySelector('#vr').value = rec ? (rec.reason || '') : (pre.reason || '');
  m.querySelector('#vr').focus();
  m.querySelectorAll('[data-fill]').forEach(function(b){
    b.addEventListener('click', function(){
      const t = m.querySelector('#vr');
      const cur = t.value.trim();
      t.value = cur ? (cur.replace(/[、，,；;]$/,'') + '、' + b.dataset.fill) : b.dataset.fill;
      t.focus();
    });
  });
  m.querySelector('[data-close]').addEventListener('click', closeModal);
  m.querySelector('#vSave').addEventListener('click', ()=>{
    const reason = m.querySelector('#vr').value.trim();
    if(!reason){ toast('請填寫事由'); return; }
    const key = m.querySelector('#vk').value, date = m.querySelector('#vd').value;

    if(!date){ toast('請選擇日期'); return; }
    if(rec){ rec.key = key; rec.date = date; rec.reason = reason; rec.points = points; }
    else { state.violations.push({ id:newId('v'), key:key, date:date, reason:reason, points:points }); }
    closeModal(); commit(); toast(rec ? '已更新違規紀錄' : '已新增違規紀錄');
  });
}

/* LINE 公告圖：名單 PNG，班級底色交錯，欄位只有班級、座號、姓名、五天、天數、備註 */
function exportRosterPng(){
  const iso = expRef();
  const rows = E.seatRows(state);
  if(!rows.length){ toast('目前沒有名單可以輸出圖檔'); return; }

  /* 出圖寬度固定 1080 像素（LINE 剛好），版面座標也是 1080 寬，所以比例是 1。 */
  const COLS = [
    { t:'班級', w:96 }, { t:'座號', w:84 }, { t:'姓名', w:180 },
    { t:'一', w:52 }, { t:'二', w:52 }, { t:'三', w:52 }, { t:'四', w:52 }, { t:'五', w:52 },
    { t:'天數', w:80 }, { t:'備註', w:380 }
  ];
  const W = COLS.reduce(function(a,c){ return a + c.w; }, 0);
  const RATIO = 1080 / W;
  const TITLE_H = 104, HEAD_H = 48, ROW_H = 38, PAD = 18;
  const H = TITLE_H + HEAD_H + rows.length * ROW_H + PAD;

  const cv = document.createElement('canvas');
  cv.width = W * RATIO; cv.height = H * RATIO;
  const g = cv.getContext('2d');
  g.scale(RATIO, RATIO);
  const FONT = '"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';

  g.fillStyle = '#FAF4E6';
  g.fillRect(0, 0, W, H);

  const term = E.opt(state, 'term') || '';
  const school = E.opt(state, 'school') || '';
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#1F1B15';
  g.font = '600 27px ' + FONT;
  g.fillText((school ? school + '　' : '') + '夜自習名單', 20, 50);
  g.fillStyle = '#4A4237';
  g.font = '16px ' + FONT;
  g.fillText((term ? term + '　' : '') + '基準日 ' + iso + '　共 ' + rows.length + ' 人', 20, 82);

  /* 表頭 */
  g.fillStyle = '#9E2B18';
  g.fillRect(0, TITLE_H, W, HEAD_H);
  g.fillStyle = '#FBF1EC';
  g.font = '600 19px ' + FONT;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  let hx = 0;
  COLS.forEach(function(c){ g.fillText(c.t, hx + c.w / 2, TITLE_H + HEAD_H / 2 + 1); hx += c.w; });

  /* 資料列：班級交錯底色 */
  let bandOrder = -1, bandCls = null;
  const classLineY = [];
  rows.forEach(function(r, i){
    if(r.cls !== bandCls){ bandOrder++; bandCls = r.cls; classLineY.push(TITLE_H + HEAD_H + i * ROW_H); }
    const y = TITLE_H + HEAD_H + i * ROW_H;
    if(bandOrder % 2 === 1){ g.fillStyle = '#F0E6D2'; g.fillRect(0, y, W, ROW_H); }
    const days = r.days.reduce(function(a,b){ return a+b; },0);
    const note = String((E.byKey(state, r.key) || {}).note || '');
    const cells = [String(r.cls), String(r.seat), r.name]
      .concat(r.days.map(function(v){ return v ? '■' : '□'; }))
      .concat([String(days), note]);
    g.fillStyle = '#1F1B15';
    g.font = '17px ' + FONT;
    let cx = 0;
    cells.forEach(function(v, ci){
      const c = COLS[ci];
      const left = (ci === 2 || ci === 9);
      g.textAlign = left ? 'left' : 'center';
      let text = String(v == null ? '' : v);
      const maxW = c.w - 16;
      if(g.measureText(text).width > maxW){
        while(text.length > 1 && g.measureText(text + '…').width > maxW) text = text.slice(0, -1);
        text += '…';
      }
      g.fillText(text, left ? cx + 8 : cx + c.w / 2, y + ROW_H / 2 + 1);
      cx += c.w;
    });
  });

  /* 格線 */
  const top = TITLE_H, bottom = TITLE_H + HEAD_H + rows.length * ROW_H;
  g.strokeStyle = '#C3B394'; g.lineWidth = 1;
  g.beginPath();
  for(let i = 0; i <= rows.length; i++){
    const y = top + HEAD_H + i * ROW_H + 0.5;
    g.moveTo(0, y); g.lineTo(W, y);
  }
  let x = 0;
  COLS.forEach(function(c){ x += c.w; g.moveTo(x + 0.5, top); g.lineTo(x + 0.5, bottom); });
  g.moveTo(0.5, top); g.lineTo(0.5, bottom);
  g.stroke();
  /* 班級界線畫粗一點 */
  g.strokeStyle = '#8C7A5B'; g.lineWidth = 2;
  classLineY.forEach(function(y){
    g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke();
  });
  g.strokeStyle = '#9E2B18'; g.lineWidth = 3;
  g.strokeRect(1.5, top + 1.5, W - 3, HEAD_H + rows.length * ROW_H - 3);

  cv.toBlob(function(blob){
    download(blob, (E.opt(state,'exportPrefix')||'夜自習') + '_名單_' + stamp() + '.png');
    toast('已下載名單圖檔（PNG，寬 1080 像素，可直接貼到 LINE）');
  }, 'image/png');
}

function stamp(){ return expRef().replace(/-/g,''); }
/* 印表日期：2026-10-27 → 1027（月日各兩位，與範本表頭一致） */
function mmdd(iso){ const p = String(iso||'').split('-'); return p.length===3 ? (p[1]+p[2]) : ''; }

  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 600);
}

/* 範本轉存成 Excel 檔後，Excel 會挑剔兩件事：ExcelJS 轉不出規則時留下的空 <conditionalFormatting/>，
   以及空的定義名稱。前者直接從 zip 裡拿掉，檔案才打得開。 */
async function cleanXlsxParts(buf){
  try{
    const PizZip = window.PizZip;
    if(!PizZip) return buf;
    const zip = new PizZip(buf);
    let hits = 0;
    Object.keys(zip.files).forEach(function(name){
      if(!/^xl\/worksheets\/sheet\d+\.xml$/.test(name)) return;
      const f = zip.file(name);
      if(!f) return;
      const xml = f.asText();
      const cleaned = xml
        .replace(/<conditionalFormatting\b[^>]*\/>/g, function(){ hits++; return ''; })
        .replace(/<conditionalFormatting\b[^>]*>\s*<\/conditionalFormatting>/g, function(){ hits++; return ''; });
      if(cleaned !== xml) zip.file(name, cleaned);
    });
    if(!hits) return buf;
    return zip.generate({ type:'uint8array', compression:'DEFLATE' });
  }catch(err){ return buf; }
}

/* 刪完欄位後，範本留下的空白欄（連同欄寬）一起收乾淨，看起來才是真的刪掉 */
function trimEmptyCols(ws){
  let last = 1;
  ws.eachRow({ includeEmpty:false }, function(row){
    row.eachCell({ includeEmpty:false }, function(cell, col){ if(col > last) last = col; });
  });
  if(ws.columnCount > last) ws.spliceColumns(last + 1, ws.columnCount - last);
}

async function exportXlsx(){
  try{

    wb.worksheets.slice().forEach(function(w){ if(w !== wsT0) wb.removeWorksheet(w.id); });

    /* 名單（自動產生）：每次重新產生，內容乾淨、可直接列印 */
    const SHEET = '名單（自動產生）';
    const oldSheet = wb.getWorksheet(SHEET);
    if(oldSheet) wb.removeWorksheet(oldSheet.id);
    const wsP = wb.addWorksheet(SHEET, { views:[{state:'frozen',ySplit:2}] });
    const head = ['序號','班級','座號','姓名','一','二','三','四','五','天數','電話'];
    [6,8,7,12,6,6,6,6,6,7,15].forEach(function(w,i){ wsP.getColumn(i+1).width = w; });
    /* 名單用「基準日當天生效」的參加設定，和總表、點名頁同一套算法 */
    const rows = E.active(state).map(function(s){
      return { key:s.key, cls:s.cls, seat:s.seat, name:s.name, days:E.daysAt(state, s.key, iso) };
    }).sort(function(a,b){ return a.cls-b.cls || String(a.seat).localeCompare(String(b.seat)); });
    const first = 3, last = rows.length+2, sumRow = last+1;
    const hasRows = rows.length > 0;
    wsP.mergeCells(1,1,1,head.length);
    wsP.getCell(1,1).value = (state.meta.term||'')+'　夜自習名單（'+iso+' 基準，共 '+rows.length+' 人）';
    wsP.getCell(1,1).font = { name:'標楷體', size:14, bold:true };
    wsP.getCell(1,1).alignment = { horizontal:'center', vertical:'middle' };
    wsP.getRow(1).height = 26;
    head.forEach(function(h,i){
      const c = wsP.getCell(2,i+1);
      c.value = h;
      c.font = { name:'標楷體', size:11, bold:true };
      c.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFEDE6D6' } };
      c.border = borderAll();
    });
    wsP.getRow(2).height = 22;
    /* 不同班級用交錯底色分隔，一眼看出班級界線 */
    const bandFill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF3EEE1' } };
    let bandOrder = -1, bandCls = null;
    rows.forEach(function(r,i){
      if(r.cls !== bandCls){ bandOrder++; bandCls = r.cls; }
      const banded = (bandOrder % 2) === 1;
      const s = E.byKey(state,r.key)||{};
      const row = i+first;
      const days = r.days.reduce(function(a,b){ return a+b; },0);
      const vals = [i+1, r.cls, r.seat, r.name].concat(r.days)
        .concat([null, s.phone || '']);
      vals.forEach(function(v,ci){
        const c = wsP.getCell(row, ci+1);
        c.value = v;
        c.font = { name:'標楷體', size:11 };
        c.alignment = { horizontal:(ci===3||ci===10)?'left':'center', vertical:'middle' };
        c.border = borderAll();
        if(banded) c.fill = bandFill;
      });
      /* 天數用加總公式，改勾選就自己重算 */
      wsP.getCell(row,10).value = { formula:'SUM(E'+row+':I'+row+')', result:days };
    });
    wsP.getCell(sumRow,1).value = '每日合計';
    wsP.mergeCells(sumRow,1,sumRow,4);
    const dayCols = ['E','F','G','H','I'];
    for(let i=0;i<5;i++){
      const col = dayCols[i];
      const total = rows.reduce(function(a,r){ return a+r.days[i]; },0);
      wsP.getCell(sumRow,5+i).value = hasRows
        ? { formula:'SUM('+col+first+':'+col+last+')', result:total }
        : total;
    }
    const daySum = rows.reduce(function(a,r){ return a+r.days.reduce(function(x,y){ return x+y; },0); },0);
    wsP.getCell(sumRow,10).value = hasRows
      ? { formula:'SUM(J'+first+':J'+last+')', result:daySum }
      : daySum;
    for(let c=1; c<=head.length; c++){
      const cell = wsP.getCell(sumRow,c);
      cell.font = { name:'標楷體', size:11, bold:true };
      cell.alignment = { horizontal:'center', vertical:'middle' };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF6F1E4' } };
      cell.border = borderAll();
    }
    wsP.pageSetup = { paperSize:9, orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0,
      printTitlesRow:'1:2', horizontalCentered:true,
      margins:{ left:0.4, right:0.4, top:0.5, bottom:0.5, header:0.2, footer:0.2 } };

    /* 總表：各班五天人數直接引用名單，改名單就自己重算（總數是班級名冊人數，維持固定值） */
    const Q = "'"+SHEET+"'!";
    const wsT = wb.getWorksheet('總表');
    const dayTotals = [0,0,0,0,0];
    mat.rows.forEach(function(r){ for(let i=0;i<5;i++) dayTotals[i] += r.per[i]; });
    if(wsT){
      /* 不參加人數、缺交、缺交號碼三欄用不到，直接從範本刪掉（含標題與合計公式） */
      if(wsT.getCell(1,9).value) wsT.spliceColumns(9, 3);
      mat.rows.forEach(function(r){
        for(let row=2; row<=12; row++){
          if(Number(wsT.getCell(row,1).value)===Number(r.cls)){
            wsT.getCell(row,2).value = r.total;
            for(let i=0;i<5;i++){
              wsT.getCell(row,3+i).value = hasRows
                ? { formula:'COUNTIFS('+Q+'$B$'+first+':$B$'+last+',$A'+row+','+Q+'$'+dayCols[i]+'$'+first+':$'+dayCols[i]+'$'+last+',1)',
                    result:r.per[i] }
                : r.per[i];
            }
            wsT.getCell(row,8).value = hasRows
              ? { formula:'COUNTIFS('+Q+'$B$'+first+':$B$'+last+',$A'+row+','+Q+'$J$'+first+':$J$'+last+',">0")',
                  result:r.joined }
              : r.joined;
            /* 參加人數之後的欄位已刪除，不再寫入 */
            break;
          }
        }
      });

      /* 合計列：保留範本的 SUM 公式，補上算好的結果，不重算的檢視器也看得到數字 */
      const totals = [mat.total, dayTotals[0], dayTotals[1], dayTotals[2], dayTotals[3], dayTotals[4], mat.joined];
      for(let row=2; row<=wsT.rowCount; row++){
        const a = wsT.getCell(row,1).value;
        if(typeof a === 'string' && a.indexOf('總計')===0){
          totals.forEach(function(v,i){
            const cell = wsT.getCell(row, i+2);
            const cur = cell.value;
            if(cur && typeof cur === 'object' && (cur.formula || cur.shareType === 'shared' || cur.sharedFormula)){
              cell.value = Object.assign({}, cur, { result:v });
            }
          });
          break;
        }
      }
    }

    /* 名單只留到電話欄、總表只留到參加人數欄 */
    trimEmptyCols(wsP);
    if(wsT) trimEmptyCols(wsT);
    wb.calcProperties = { fullCalcOnLoad:true };
    const raw = await wb.xlsx.writeBuffer();
    const out = await cleanXlsxParts(raw);
    download(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), (E.opt(state,'exportPrefix')||'夜自習')+'_名單_'+stamp()+'.xlsx');
    toast('已下載 Excel');
  }catch(err){ toast('匯出失敗：'+err.message, 5000); }
}

function colLetter(n){
  let s = '';
  while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

/* 匯出用：某位訂餐者在一週內的供餐份數 */
function countWeek(mem, wk, st){
  let n = 0;
  wk.slots.forEach(function(sl){
    if(sl && !sl.holiday && E.meal.planned(st, mem, sl.iso)) n++;
  });
  return n;
}
/* 匯出用：全校總表某一欄（日份數或週小計）的合計 */
function countCol(mem, c, mo, st){
  const wi = Math.floor((c - 3) / 6), di = (c - 3) % 6;
  if(di === 5) return countWeek(mem, mo.weeks[wi], st);
  const wk = mo.weeks[wi];
  if(!wk) return 0;
  const sl = wk.slots[di];
  if(!sl || sl.holiday) return 0;
  return E.meal.planned(st, mem, sl.iso) ? 1 : 0;
}
/* 匯出用：統一的儲存格樣式 */
function setMealCell(cell, value, o){
  o = o || {};
  cell.value = value;
  cell.font = { name:MEAL_FONT, size:o.size || 10, bold:!!o.bold };
  cell.alignment = { horizontal: o.align || 'center', vertical:'middle', wrapText:true };
  if(o.fill) cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:o.fill } };
  if(o.border) cell.border = o.border;
  if(o.numfmt) cell.numFmt = o.numfmt;
}
/* ---------- 設定 ---------- */
function saveCfg(){
  const url = $('cfgGas').value.trim() || CONFIG.GAS_URL, pwd = $('cfgPwd').value;
  CONFIG.GAS_URL = url; CONFIG.PASSWORD = pwd;
  const edited = {};
  Array.prototype.forEach.call(document.querySelectorAll('[data-opt]'), function(el){
    edited[el.dataset.opt] = String(el.value || '').trim();
  });
  localStorage.setItem('nightstudy.gas', url);
  localStorage.setItem('nightstudy.pwd', pwd);
  /* 輪值教師密語寫進試算表「設定」工作表的 password 列（管理密語,教師密語），任何裝置都認得 */
  const tpRaw = $('cfgTeacher') ? String($('cfgTeacher').value || '').trim() : '';
  if(tpRaw){
    if(!API.reachable()){
      toast('教師密語要連上雲端才能寫進試算表，目前沒有寫入', 5600);
    }else{
      API.call({ action:'setPasswords', admin:pwd, teacher:tpRaw }).then(function(res){
        if($('cfgTeacher')) $('cfgTeacher').value = '';
        cloud.hasTeacher = !!(res && res.ok);
        toast(res && res.ok ? '已把輪值教師密語寫進試算表，其他裝置也能用' : ('教師密語沒有寫入：' + ((res && res.error) || '請確認後端已更新')), 6000);
        renderMemoState();
      }).catch(function(err){
        toast('教師密語沒有寫入：' + err.message, 6000);
      });
    }
  }
  (async function(){
    try{
      /* 先確認密語可用：雲端有名冊而這台還是空的，就以雲端為準，避免用空白把試算表蓋掉 */
      if(API.reachable()){
        /* 這裡只等一次：設定頁按下去要馬上回應，失敗就交給下面的提示 */
        const r = await API.load({ tries:1 });
        if(r.ok && r.state && (r.state.students || []).length && !(state.students || []).length){
          state = r.state;
          normalize();
          toast('已載入試算表資料');
        }
      }
      state.opts = state.opts || {};
      Object.keys(edited).forEach(function(k){ state.opts[k] = edited[k]; });
      state.meta = state.meta || {};
      state.meta.school = state.opts.school || '';
      state.meta.term = state.opts.term || '';
      cloud.authoritative = true;
      await API.save(true);
      render();
      toast(state.students && state.students.length ? '設定已儲存' : '設定已儲存（試算表還沒名冊資料）', 4200);
    }catch(err){
      render();
      toast('雲端連線失敗：'+err.message, 5000);
    }
  })();
}

  });
  t('異動日誌 6 筆', ()=>{ const n=E.recentLog(state).length; return n>=6||'實際 '+n; });
  t('輪值教師 62 天', ()=>{ const n=state.duty.filter(d=>d.teacher).length; return n===62||'實際 '+n; });
  t('違規單每頁 2 份（A4 橫式）', ()=>{ const b=E.vioPages(state,(state.violations||[]).map(v=>v.id));
    const total = b.pairs.length*2 + b.tail.length;
    return total===(state.violations||[]).length || '張數 '+total; });
  $('testOut').innerHTML = out.join('');
}

/* ---------- 啟動 ---------- */
function normalize(){
  state.meta = state.meta || {};
  state.opts = state.opts || {};
  /* 舊資料只有 meta.school／meta.term，搬進 opts 當作唯一來源 */
  if(!state.opts.school && state.meta.school) state.opts.school = state.meta.school;
  if(!state.opts.term && state.meta.term) state.opts.term = state.meta.term;
  /* 缺的參數就補上預設值，儲存時會一併寫回試算表「設定」工作表，方便直接在試算表調整 */
  const eff = E.optsOf(state);
  Object.keys(eff).forEach(function(k){ if(state.opts[k]===undefined) state.opts[k] = eff[k]; });
  /* 起訖日一律收成 YYYY-MM-DD（試算表會把它自動變成日期，讀回來是一長串英文） */
  ['nsStart','nsEnd'].forEach(function(k){
    if(state.opts[k]) state.opts[k] = toIsoDate(state.opts[k]);
  });
  /* 待處理退費通知框的開合狀態：記在這台裝置，下次開頁照上次的樣子 */
  try{ ui.mealNoticeOpen = localStorage.getItem('nightstudy.mealnotice') === '1'; }
  catch(err){ ui.mealNoticeOpen = false; }
  state.meta.school = state.opts.school || '';
  state.meta.term = state.opts.term || '';
  state.config = state.config || {};
  if(!state.config.refDate) state.config.refDate = E.today();
  state.config.totals = state.config.totals || {};
  ['enrollments','calendar','leaves','violations','checkins','duty','dutyNotes','meals','mealMembers','mealAdjusts','conflicts'].forEach(function(k){ state[k]=state[k]||[]; });
  /* 便當選項改成只分訂、不訂：舊設定裡的葷、素自動換掉 */
  if(/葷|素/.test(String(state.opts.lunchOptions||''))) state.opts.lunchOptions = '訂、不訂';
  state.seats = state.seats || {};
  state.seatPair = state.seatPair || {};
  Object.keys(state.seatPair).forEach(function(k){
    const key = state.seatPair[k];
    const s = key ? E.byKey(state, key) : null;
    if(!key || !s || s.active === false || !state.seats[k] || state.seats[k] === key) delete state.seatPair[k];
  });
  state.students = (state.students||[]).map(function(s){
    if(!Array.isArray(s.days) || s.days.length!==5) s.days = [0,0,0,0,0];
    if(s.active===undefined) s.active = true;
    if(s.sid===undefined) s.sid = '';
    return s;
  });
  /* 名冊整併：雲端若只有舊的 51 人名單，自動補齊九年級名冊中缺的學生（一律不參加） */
  const seedAll = (window.SEED && window.SEED.students) || [];
  const seedByKey = {};
  seedAll.forEach(function(s){ seedByKey[s.key] = s; });
  const have = {};
  state.students.forEach(function(s){
    have[s.key] = 1;
    if(!s.sid && seedByKey[s.key]) s.sid = seedByKey[s.key].sid || '';
  });
  seedAll.forEach(function(s){
    if(have[s.key]) return;
    state.students.push({ key:s.key, cls:s.cls, seat:s.seat, name:s.name, sid:s.sid||'',
      phone:'', lunch:'', parentDuty:false, note:'', days:[0,0,0,0,0], active:false });
  });
  if(state.students.length){
    const t = {};
    state.students.forEach(function(s){ t[s.cls] = (t[s.cls]||0)+1; });
    state.config.totals = t;
  }
  ui.weekRef = ui.weekRef || state.config.refDate;
}

function emptyState(){
  return {
    meta:{ school:'', term:'', source:'' },
    opts:{},
    config:{ refDate:E.today(), totals:{} },
    students:[], enrollments:[], calendar:[], leaves:[], violations:[],
    checkins:[], seats:{}, seatPair:{}, duty:[], dutyNotes:[], conflicts:[]
  };
}
/* 從雲端讀名冊的唯一入口：開頁、「重新載入」、失敗後自動重試都走這裡 */
async function loadFromCloud(opts){
  opts = opts || {};
  if(!API.reachable()){ render(); return { ok:false, error:'還沒有連上雲端' }; }
  if(cloud.loading) return { ok:false, error:'正在載入中' };
  cloud.loading = true; cloud.failed = false; cloud.lastError = ''; cloud.retries = 0;
  cloud.t0 = Date.now();
  cloudTicker(true); renderSetupBar(); renderCloudPill();
  /* 手動重新載入一定要拿最新版（老師可能直接在試算表改過），所以不比世代、也不走快取 */
  const fresh = opts.fresh === true;
  const gen = (!fresh && cloud.authoritative) ? (cloud.generation || '') : '';
  try{
    const r = await API.load({ fresh: fresh, generation: gen, onRetry:function(n, err){
      cloud.retries = n;
      cloud.lastError = String((err && err.message) || '');
      renderSetupBar(); renderCloudPill();
    } });
    cloud.loading = false; cloudTicker(false); cloud.retries = 0;
    cloud.lastLoad = { at:new Date(), ms:r.ms || 0, serverMs:r.serverMs || 0,
      cached:!!r.cached, notModified:!!r.notModified };
    if(r.ok && r.generation) cloud.generation = r.generation;
    if(r.ok && r.notModified){
      /* 後端說資料沒變：直接沿用畫面上這份，一次讀表都省下來 */
      cloud.authoritative = true; cloud.failed = false; cloud.lastError = '';
      render();
      return { ok:true, notModified:true, ms:r.ms, serverMs:r.serverMs };
    }
    return applyCloudResult(r);
  }catch(err){
    cloud.loading = false; cloudTicker(false); cloud.retries = 0;
    cloud.failed = true;
    cloud.lastError = String((err && err.message) || '連不上雲端');
    render();
    scheduleCloudRetry();
    return { ok:false, error: cloud.lastError };
  }
}

/* 雲端回來的結果怎麼套進畫面：載入期間有本機修改就保留畫面，不覆蓋也不回寫 */
function applyCloudResult(r){
  if(!r || !r.ok){
    cloud.failed = true;
    cloud.lastError = (r && r.error) || '還沒有連上雲端';
    render();
    return r || { ok:false };
  }
  const st = r.state || {};
  const hasRoster = !!(st.students && st.students.length);
  cloud.failed = false; cloud.lastError = ''; cloud.autoRetries = 0;
  if(hasRoster && dirty){
    cloud.authoritative = false;
    render();
    toast('雲端有資料，但你剛才的修改只在本機、還沒上傳。要用雲端版本請按「從雲端重新載入」；要以本機為準請按「儲存設定」', 9000);
    return { ok:true, kept:true };
  }
  cloud.authoritative = true;
  if(hasRoster){
    state = st;
    normalize(); syncToday(); dirty = false;
    /* 記下「這份畫面已同步」的指紋，之後存檔只送有變動的項目 */
    cloud.synced = API.snapshot();
    render();
    if(cloud.pending){
      cloud.pending = false;
      API.save().then(function(){ toast('剛才的修改已補存到雲端', 3600); }).catch(function(){});
    }
    return { ok:true, ms:r.ms, serverMs:r.serverMs, cached:r.cached };
  }
  /* 雲端還沒有名冊：把本機這份送上去（多半是空表，只是先建立表頭） */
  render();
  if(!dirty) API.save().catch(function(){});
  toast('雲端試算表還沒有名冊資料，請先在「名單」工作表建立，或到「設定與檢查」匯入備份檔', 7000);
  return { ok:true, empty:true };
}

/* 連不上時每 15 秒自動再試一次，最多 3 次，避免一直空轉 */
let retryTimer = null;
function scheduleCloudRetry(){
  if(retryTimer) clearTimeout(retryTimer);
  if(cloud.autoRetries >= 3) return;
  retryTimer = setTimeout(function(){
    retryTimer = null;
    if(cloud.loading || !cloud.failed) return;
    if(document.visibilityState === 'hidden'){ scheduleCloudRetry(); return; }
    cloud.autoRetries++;
    loadFromCloud();
  }, 15000);
}

/* 「從雲端重新載入」與提示條上的「重新連線」共用；按鈕先鎖住，避免連點產生多筆請求 */
/* 「從雲端重新載入」與提示條上的「重新連線」共用；按鈕先鎖住，避免連點產生多筆請求 */
async function reloadCloud(btn){
  if(cloud.loading){ toast('正在載入中，請稍等', 2200); return { ok:false, error:'正在載入中' }; }
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '載入中…'; }
  cloud.autoRetries = 0;
  const r = await loadFromCloud({ fresh:true });
  if(btn){ btn.disabled = false; btn.textContent = label || '從雲端重新載入'; }
  if(r.ok && r.notModified) toast('雲端沒有新資料', 2400);
  else if(r.ok && r.ms) toast('已重新載入（前端 ' + (r.ms/1000).toFixed(1) + ' 秒／後端 '
    + Math.round(r.serverMs || 0) + ' 毫秒' + (r.cached ? '，走快取' : '') + '）', 3600);
  else if(r.ok && !r.kept && !r.empty) toast('已重新載入雲端資料');
  else if(r.ok && r.empty) toast('雲端目前沒有名冊（本機不保留資料，畫面維持空白）', 5600);
  else if(!r.ok && r.error !== '正在載入中') toast('重新載入失敗：' + (r.error || '請確認網路'), 5600);
  return r;
}
async function boot(){
  CONFIG.GAS_URL = localStorage.getItem('nightstudy.gas') || CONFIG.GAS_URL || '';
  /* 身分：上一次登入留下的身分，實際仍以後端 ping 回傳的 role 為準 */
  ROLE = localStorage.getItem(CONFIG.ROLE_KEY) === 'teacher' ? 'teacher' : 'admin';
  CONFIG.PASSWORD = localStorage.getItem('nightstudy.pwd') || CONFIG.PASSWORD || '';
  $('cfgGas').value = CONFIG.GAS_URL;
  $('cfgPwd').value = CONFIG.PASSWORD;

  /* 一進網頁先確認身分：這台裝置記住的密語直接進站，不等網路；背景再向後端核對一次 */
  if(!window.__NS_NOGATE){
    const memo = await GATE.saved();
    if(memo.ok){
      unlockUI();
      /* 要載入雲端時順便就驗了密語，省掉一次多餘的往返；只有在不載入時才背景核對 */
      if(!API.reachable()){
        GATE.checkSaved().then(function(bad){
          if(bad !== 'stale') return;
          GATE.forget();
          CONFIG.PASSWORD = '';
          if($('cfgPwd')) $('cfgPwd').value = '';
          renderMemoState();
          toast('這台裝置記住的密語已失效（試算表改過），請重新輸入', 6000);
          showGate('這台裝置記住的密語已經不能用（試算表「設定」工作表的 password 可能改過），請輸入新的密語。');
        });
      }
    }else{
      await showGate(memo.stale ? '這台裝置的密語紀錄不完整，請重新輸入一次。' : '');
    }
  }
  renderMemoState();

  /* 本機不保存名冊資料：順手清掉舊版留在這台裝置的副本 */
  try{
    localStorage.removeItem(CONFIG.STORE_KEY);
    localStorage.removeItem('nightstudy.pendingbak');
  }catch(err){}
  /* 一律從雲端讀取；window.SEED 只保留給測試與匯入用 */
  state = window.SEED ? JSON.parse(JSON.stringify(window.SEED)) : emptyState();
  normalize();
  /* 點名單預設日期自動移到今天 */
  syncToday();
  render();
  /* 背景先把 templates 資料夾裡的範本讀進記憶體，第一次匯出就不必等 */
  API.warmTemplates().then(function(){
    if(ui.tab==='export') renderExport();
  }).catch(function(){});

  if(!API.isCloud()){ LIB.warm(); return; }
  /* 有網址但還沒有密語：先不發請求，等使用者輸入密語後再載入 */
  if(!CONFIG.PASSWORD){ LIB.warm(); return; }

  const r = await loadFromCloud();
  /* 後端明確說密語不對：清掉這台裝置的紀錄，重新上鎖 */
  if(!r.ok && /通關密語不正確/.test(r.error || '')){
    GATE.forget();
    CONFIG.PASSWORD = '';
    if($('cfgPwd')) $('cfgPwd').value = '';
    renderMemoState();
    await showGate('雲端說通關密語不正確（試算表「設定」工作表的 password 可能改過），請輸入新的密語。');
    if(CONFIG.PASSWORD) await loadFromCloud();
  }
  /* 名冊讀完、畫面閒下來之後，才在背景預抓匯出用的大檔 */
  LIB.warm();
}

/* 拖曳（桌機） */
document.addEventListener('dragstart', e=>{
  const seat = e.target.closest('[data-slot]');
  if(!seat) return;
  const key = state.seats[String(seat.dataset.slot)] || '';
  if(!key) { e.preventDefault(); return; }
  e.dataTransfer.setData('text/plain', String(seat.dataset.slot));
  ui.sel = { kind:'slot', slot:Number(seat.dataset.slot) };
});
document.addEventListener('dragover', e=>{ const s=e.target.closest('[data-slot]'); if(s) e.preventDefault(); });
document.addEventListener('drop', e=>{
  const s = e.target.closest('[data-slot]');
  if(!s) return;
  e.preventDefault();
  const from = Number(e.dataTransfer.getData('text/plain'));
  if(!isNaN(from)) placeSeat(Number(s.dataset.slot));
});

/* 請假紀錄：新增／刪除／篩選 */
document.addEventListener('click', e=>{
  if(e.target.id==='btnAddLeave'){ openLeaveNew(); return; }
  const del = e.target.closest('[data-leavedel]');
  const lve = e.target.closest('[data-lvedit]');
  if(lve){ openLeaveEdit(lve.dataset.lvedit); return; }
  if(del){ deleteLeave(del.dataset.leavedel); return; }
  const lvf = e.target.closest('[data-lvf]');
  if(lvf){ ui.lvFilter = lvf.dataset.lvf; ui.lvPage = 1; renderLeave(); return; }
  const lvp = e.target.closest('[data-lvpage]');
  if(lvp){
    if(lvp.disabled) return;
    ui.lvPage = Number(lvp.dataset.lvpage) || 1;
    renderLeave();
    return;
  }
});

/* 請假紀錄：改每頁筆數就回到第 1 頁 */
document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'lvSize'){
    const n = Number(e.target.value);
    if(LEAVE_SIZES.indexOf(n) >= 0){
      ui.lvSize = n;
      ui.lvPage = 1;
      renderLeave();
    }
  }
});

/* 學生清單：篩選與批次 */
document.addEventListener('click', e=>{
  const rc = e.target.closest('[data-rcls]');
  if(rc){ ui.rcls = Number(rc.dataset.rcls) || 0; renderList(); return; }
  const sh = e.target.closest('[data-show]');
  if(sh){ ui.show = sh.dataset.show; renderList(); return; }
  const bt = e.target.closest('[data-batch]');
  if(bt){
    const k = bt.dataset.batch;
    if(k==='in') batchActive(true);
    else if(k==='out') batchActive(false);
    else if(k==='days') batchDays();
    else if(k==='lunch') batchLunch();
    else { ui.pick.clear(); renderList(); }
    return;
  }
});

/* 匯出表單：指定基準日（不指定就跟點名頁同一天） */
document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'expRefDate') ui.expDate = e.target.value || '';
});
document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'expRefToday'){
    ui.expDate = E.today();
    renderExport();
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='rosterQ'){ ui.q = e.target.value; renderListBody(); }
});

/* 設定頁的常用清單：邊打字邊預覽會變成幾個按鈕（只認頓號，逗號不切） */
document.addEventListener('input', e=>{
  if(e.target && e.target.dataset && e.target.dataset.opt) refreshOptPreviews();
});

/* 有修改還在傳（或雲端沒載入）就離開頁面時提醒一下，避免資料沒寫進試算表 */
window.addEventListener('beforeunload', function(e){
  if(saving || cloud.pending){
    e.preventDefault();
    e.returnValue = '資料還在存到雲端，離開可能不會存檔';
    return e.returnValue;
  }
});

/* 網路恢復時自動把還沒載完的名冊補上，不必手動按 */
window.addEventListener('online', function(){
  if(cloud.failed && !cloud.loading) reloadCloud(null);
});

window.__NS = { CONFIG, get state(){ return state; }, get ui(){ return ui; }, E, API, render, renderToday, renderSeat, renderLog, renderDuty,
  renderList, renderListBody, listRows, setActive, batchActive, batchDays, dropSeatOf,
  releaseSeat, printVio, vioPages, openVioForm, renderLeave, openLeaveNew, deleteLeave, leaveList,
  printSeat, autoSeat, seatPart, deskSlots, deskBotKey,
  openExit, openExitBatch, renderLog, OPTS, closeModal, renderConfig, renderSheetLink, sheetBook,
  get cloud(){ return cloud; }, optsOf(){ return E.optsOf(state); },
  setTemplate(n,b){ TPL[n]=b; }, setTab(t){ ui.tab=t; render(); } };
boot();
