<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>夜自習點名簿</title>
<style>
:root{
  --paper:#E8DDC4; --sheet:#F3EBD9; --sheet-2:#EEE4CE; --card:#FAF4E6;
  --ink:#1F1B15; --ink-2:#4A4237; --ink-3:#6C6251;
  --rule:#C3B394; --rule-soft:#D6C9AC;
  --seal:#9E2B18; --seal-soft:#F0DAD2;
  --ok:#3F6B4F; --ok-soft:#E2EBDD;
  /* 便當表格：暖紙底上只留一支冷色（黛青）代表待退，其餘一律暖灰米 */
  --g-head:#EAE2CE; --g-week:#F6EEDD; --g-sub:#EFE6D2; --g-total:#F6EBCE;
  --g-band:#F7F1E2; --g-off:#F5F0E3;
  --g-take:#F2DCD0; --g-take-ink:#8A3226;
  --g-wait:#DCE6E5; --g-wait-ink:#3A585C;
  --g-done:#DFE9DA; --g-foot:#E7DFCB;
  --serif:"Noto Serif TC","標楷體","DFKai-SB",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.75}
body{
  background-image:
    repeating-linear-gradient(90deg, rgba(120,100,70,.045) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(0deg, rgba(120,100,70,.03) 0 1px, transparent 1px 5px);
  min-height:100vh;
}
button{font-family:inherit;font-size:14px;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

.sheet{
  min-height:100vh;display:grid;grid-template-columns:186px minmax(0,1fr);
  background:var(--sheet);border-left:1px solid var(--rule);border-right:1px solid var(--rule);
}

/* ---------- 左：今夜要點 ---------- */
.stats{border-right:1px solid var(--rule);padding:22px 18px;display:flex;flex-direction:column;gap:16px;
  position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.stats h2{margin:0;font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.22em;color:var(--ink-2)}
.stat{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule-soft);padding-bottom:6px}
.stat .n{font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:600}
.stat .k{font-size:12px;color:var(--ink-3);letter-spacing:.16em}
.stat.warn .n{color:var(--seal)}
.stats .quote{margin-top:auto;font-size:12px;color:var(--ink-3);line-height:1.9}
.stats .quote b{display:block;font-family:var(--serif);font-size:13px;color:var(--ink-2);letter-spacing:.1em}
.stats .quote .qsum{font-family:var(--serif);color:var(--ink-2);letter-spacing:.1em}

/* ---------- 中：主區 ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{padding:18px 26px 0}
.topline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topline h1{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.12em}
.topline .meta{font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.topline .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.tabs{display:flex;gap:2px;margin-top:14px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.tabs button{
  border:0;background:transparent;padding:9px 15px;min-height:44px;font-size:13px;color:var(--ink-3);
  border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;letter-spacing:.06em;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--seal)}
.setupbar{margin:12px 0 0;padding:10px 14px;border:1px solid #DCB6AA;border-radius:6px;
  background:var(--seal-soft);color:#7E2415;font-size:13px;line-height:1.7}
.setupbar[hidden]{display:none}

.page{display:none;padding:16px 26px 34px}
.page.on{display:block}

/* ---------- 控制列 ---------- */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools>*{flex:0 0 auto}
.tools>span.hint{flex:1 1 220px;min-width:0;white-space:normal}
.daynav{display:flex;align-items:center;gap:4px}
.btn.nav{font-family:var(--serif);font-size:18px;line-height:1;padding:0 14px;min-width:44px;justify-content:center}
.btn{
  white-space:nowrap;
  border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:6px 14px;
  min-height:44px;cursor:pointer;color:var(--ink);
}
.btn:hover{background:#FFF9EA}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#FBF5E7}
.btn.primary:hover{background:#332C22}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#FBF1EC;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;min-height:36px;font-size:12px}
.hint{font-size:12px;color:var(--ink-3)}

/* ---------- 名冊 ---------- */
.ledger{width:100%;border-collapse:collapse;background:var(--sheet)}
.ledger th{
  font-family:var(--serif);font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--ink-2);
  text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);white-space:nowrap;
}
.ledger th.d,.ledger td.d{text-align:center;width:52px;padding-left:2px;padding-right:2px}
.ledger th.wk-hot{background:var(--seal);color:#FBF1EC;font-weight:700;border-bottom-color:var(--seal)}
.ledger th.wk-hot span{display:block;font-size:9px;letter-spacing:0;color:#FBF1EC;opacity:.85}
/* 今日那一欄：紙色壓深一階，不另起色相；表頭用朱印色塊標示 */
.ledger td.wk-hot{background:#EBE0C6}
.ledger td{padding:7px 6px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
.ledger tr.band td{background:var(--sheet-2);font-family:var(--serif);font-size:13px;letter-spacing:.2em;color:var(--ink-2)}
.ledger tbody tr.person{cursor:pointer}
.ledger tbody tr.person:hover{background:#F8F1DE}
.ledger .c{font-family:var(--serif);font-size:13px;color:var(--ink-2)}
.ledger .s{font-family:var(--serif);font-size:13px;color:var(--ink-3)}
.ledger .nm{font-family:var(--serif);font-size:16px;letter-spacing:.08em}
.ledger .note{font-size:12px;color:var(--ink-3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk{font-family:var(--serif);font-size:15px;color:var(--ink)}
.mk .off{color:#B4A68B}
.mkbtn{
  display:block;margin:0 auto;width:44px;height:44px;border-radius:6px;border:1px solid transparent;background:transparent;
  font-family:var(--serif);font-size:15px;color:var(--ink);cursor:pointer;line-height:1;
}
.mkbtn:hover{border-color:var(--rule);background:#FFF9EA}
.mkbtn.on{color:var(--ink)}
.mkbtn.off{color:#B4A68B}
/* 之後才生效的異動：名字旁的小標記，滑鼠移上去看異動內容 */
.chg{display:inline-block;margin-left:6px;padding:0 4px;font-size:10px;letter-spacing:0;
  color:var(--seal);background:var(--seal-soft);border:1px solid #DCB6AA;border-radius:3px;
  cursor:help;vertical-align:middle}
.ledger .wkmk{display:none}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-3);background:var(--card)}
/* 身分標記：hidden 要真的藏起來（.pill 自己設了 display，會蓋掉 hidden） */
#roleTag[hidden]{display:none}
.pill.seal{background:var(--seal-soft);border-color:#DCB6AA;color:#7E2415}
.pill.ok{background:var(--ok-soft);border-color:#B9CDB4;color:#2F5340}
.pill.bad{background:#F6DCD5;border-color:#DCB6AA;color:#8C2415}

/* ---------- 座位 ---------- */
.band{margin-bottom:16px}
.band .band-h{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.1em}
#seatWrap{overflow-x:auto;padding-bottom:6px}
.seatgrid{display:grid;grid-template-columns:repeat(14,minmax(44px,1fr));gap:4px;min-width:0}
#seatWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.seat{
  border:1px solid var(--rule);border-radius:5px;background:var(--card);padding:16px 4px 4px;min-height:46px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;text-align:center;cursor:pointer;position:relative;
}
.seat.tall{min-height:98px}
.seat.empty{border-style:dashed;color:var(--ink-3)}
/* 同一張桌子（同組的 A 與 C）同色；單數排一色、雙數排另一色 */
.seat.g-odd{background:var(--card)}
.seat.g-even{background:#EEE2C8}
.seat.sel{outline:2px solid var(--seal);outline-offset:1px}
.seat.over{background:#FFF3D8}
.seat .no{position:absolute;top:2px;left:5px;font-size:10px;letter-spacing:.06em;color:#8D7C5F;font-family:var(--serif)}
.seat .no i{font-style:normal;font-size:9px;margin-left:1px;color:#A2937A}
.actbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 2px}
.seat .nm{font-family:var(--serif);font-size:13px;letter-spacing:.06em}
.seat .mn{font-family:var(--serif);font-size:11px;color:var(--ink-2);letter-spacing:1px}
.seat .sub{font-size:10px;color:var(--ink-3)}
.seat.pair{padding-top:4px;justify-content:flex-start;gap:0}
.seat .part{display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 0 2px;width:100%;position:relative}
.seat .plab{position:absolute;top:0;left:4px;font-family:var(--serif);font-size:9.5px;color:#8D7C5F;letter-spacing:.04em}
.seat .plab i{font-style:normal;margin-left:3px;font-size:9px;color:var(--seal);border:1px solid var(--seal-soft);border-radius:3px;padding:0 2px}
.seat .nm{white-space:nowrap}
.chip.un{flex-direction:column;align-items:flex-start;line-height:1.3;padding:5px 12px;border-radius:14px;gap:1px}
.chip.un .un-days{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--ink-3)}
.chip.un.sel .un-days{color:#FBF1EC}
#printArea .sm+.sm{border-top:.5pt dashed #000;margin-top:1mm;padding-top:1mm}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:4px 12px;min-height:44px;display:inline-flex;align-items:center;font-size:12px;cursor:pointer}
.optprev{margin-top:6px;line-height:2}
.optprev .pill{margin:0 4px 0 0}
.copytxt{width:100%;min-height:220px;font-family:var(--mono);font-size:13px;line-height:1.9;white-space:pre}
.chip.sel{background:var(--seal);border-color:var(--seal);color:#FBF1EC}

/* ---------- 異動日誌 ---------- */
.log{list-style:none;margin:0;padding:0}
.log li{border-left:2px solid var(--rule);padding:0 0 16px 16px;position:relative}
.log li::before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--sheet);border:2px solid var(--seal)}
.log .date{font-family:var(--serif);font-size:13px;color:var(--ink-2);letter-spacing:.1em}
.log .who{font-family:var(--serif);font-size:16px;letter-spacing:.06em;margin:0 8px}
.log .chg{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.log .why{font-size:12px;color:var(--ink-3);margin-top:2px}
.log .lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.log .acts{margin-left:auto;display:flex;gap:6px}

/* ---------- 表格（違規、彙整） ---------- */
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{border-bottom:1px solid var(--rule-soft);padding:7px 8px;text-align:left}
table.data th{font-family:var(--serif);font-size:12px;letter-spacing:.14em;color:var(--ink-2);border-bottom:1px solid var(--rule)}
table.roster td.tel{font-family:var(--mono);font-size:12px;color:var(--ink)}
table.roster tr.off{opacity:.75}
table.roster th.pick,table.roster td.pick{width:52px;padding:0;text-align:center}
table.roster .cbox{display:grid;place-items:center;width:44px;height:44px;margin:0 auto;cursor:pointer}
table.roster .cbox input{width:20px;height:20px;cursor:pointer}
table.roster th.d5h,table.roster td.d5{text-align:center}
/* 表頭字與下方方塊共用同一組等寬格位，確保一一對齊 */
table.roster .d5g{display:inline-grid;grid-template-columns:repeat(5,15px);justify-items:center;align-items:center;letter-spacing:0}
table.roster .d5g i{display:block;width:15px;font-style:normal;text-align:center;line-height:1;letter-spacing:0}
table.roster th.d5h .d5g i{font-family:var(--serif);font-size:12px;color:var(--ink-2)}
table.roster td.d5 .d5g i{font-family:var(--mono);font-size:12px;color:#B4A68B}
table.roster td.d5 .d5g i.on{color:var(--ink)}
.tablewrap{overflow-x:auto}
/* 欄寬以百分比分配，隨容器等比例縮放；最窄 892px 可橫向捲動，最寬 1040px 不再拉長 */
table.roster{width:100%;min-width:892px;max-width:1040px;table-layout:fixed}
/* 請假次數與違規點數：數字可移入查看逐筆日期與原因 */
table.data th.cnt,table.data td.cnt{width:64px;text-align:center}
table.data td.cnt b{font-family:var(--serif);font-size:14px;font-weight:600;border-bottom:1px dotted var(--rule);cursor:help;padding:0 3px}
table.data td.cnt b.hot{color:var(--seal);border-bottom-color:var(--seal)}
table.data td.cnt .nul{color:var(--ink-3)}
table.data td.num{font-family:var(--serif);font-size:14px;text-align:center}
.vio-sum{margin-top:20px}
.vio-sum h3{margin:0 0 8px;font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.12em;color:var(--ink-2)}
.vio-sum .over{color:var(--seal);font-weight:700}
/* 紙本繳回勾選欄 */
table.data th.paper,table.data td.paper{width:88px;text-align:center}
table.data .pbox{display:grid;place-items:center;width:44px;height:44px;margin:0 auto;cursor:pointer}
table.data .pbox input{width:20px;height:20px;cursor:pointer}
input[type=checkbox]{accent-color:var(--seal)}
#leaveTable th:nth-child(1),#leaveTable td:nth-child(1){width:170px;white-space:nowrap}
#leaveTable th:nth-child(2),#leaveTable td:nth-child(2),
#leaveTable th:nth-child(3),#leaveTable td:nth-child(3){width:72px}
#leaveTable th:nth-child(6),#leaveTable td:nth-child(6){width:96px}
#listTools .chips{flex:1 1 240px;min-width:0}
.btn.tiny{min-height:44px;padding:2px 12px;font-size:12px}

/* ---------- 輪值日誌：直式，每日一區塊 ---------- */
.week{display:flex;flex-direction:column;gap:12px}
/* 每天一張：第一列放日期與人數，下面整塊都是紀錄區 */
.dayv{border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:14px 16px;
  display:flex;flex-direction:column;gap:12px}
.dayv.today{outline:2px solid var(--seal);outline-offset:-1px;background:var(--sheet)}
.dayv.off{background:var(--sheet-2)}
.dv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-bottom:10px;border-bottom:1px solid var(--rule-soft)}
.dv-wd{font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--ink)}
.dv-dt{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.dv-teach{font-family:var(--serif);font-size:17px;letter-spacing:.06em}
.dv-nums{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--ink-2)}
.dv-nums b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.dv-act{margin-left:auto;display:flex;gap:8px}
.dv-body{display:flex;flex-direction:column;gap:10px}
.nt{border:1px solid var(--rule-soft);border-radius:6px;background:var(--sheet);padding:8px 10px;
  display:grid;grid-template-columns:132px minmax(0,1fr) 124px;gap:10px;align-items:start;
  grid-template-areas:"time main acts"}
.nt-edit{background:var(--card);grid-template-columns:200px minmax(0,1fr) 124px}
.nt-ro{grid-template-columns:132px minmax(0,1fr);grid-template-areas:"time main"}
.nt-edit .nt-text{min-height:130px}
.nt-time{grid-area:time}
.nt-timecol{grid-area:time;display:flex;flex-direction:column;gap:6px;min-width:0}
.nt-timechips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.nt-timechips .tchip{font-size:11px;line-height:1.6;padding:3px 6px;border:1px solid var(--rule);
  border-radius:4px;background:var(--card);color:var(--ink-2);cursor:pointer;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--serif);letter-spacing:.02em}
.nt-timechips .tchip:hover{border-color:var(--seal);color:var(--seal);background:#FFF9EA}
.nt-timechips .tchip:focus-visible{outline:2px solid var(--seal);outline-offset:1px}
.nt-timewrap{position:relative;display:flex;gap:4px;align-items:center}
.nt-timewrap .nt-time{flex:1 1 auto;min-width:0}
.nt-clock{width:32px;height:32px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink-2);cursor:pointer}
.nt-clock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nt-clock:hover{border-color:var(--seal);color:var(--seal)}
.nt-clock:focus-visible{outline:2px solid var(--seal);outline-offset:1px}
.nt-time-native{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.nt-main{grid-area:main;min-width:0;display:flex;flex-direction:column;gap:6px}
.nt-acts{grid-area:acts;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nt-hint{font-size:11px;color:var(--ink-3)}
.nt-time-v{grid-area:time;font-family:var(--mono);font-size:13px;color:var(--ink-2);line-height:1.8}
.nt-text-v{grid-area:main;font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word}
/* 記事內容：可直接編輯，學生以內文標記呈現 */
.nt-text{min-height:60px;border:1px solid var(--rule-soft);border-radius:4px;background:#FFFDF6;
  padding:6px 8px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.nt-text:focus{outline:2px solid var(--seal);outline-offset:1px}
.nt-text:empty:before{content:attr(data-ph);color:var(--ink-3)}
.nt input[type=time]{width:124px;min-height:38px;border:1px solid var(--rule-soft);border-radius:4px;
  background:#FFFDF6;padding:4px 6px;font-size:13px}
.nt .nt-empty{font-size:12px;color:var(--ink-3);padding:4px 2px}
.stu-tag{background:var(--seal-soft);border:1px solid #DCB6AA;border-radius:4px;
  padding:0 5px;color:#7E2415;font-family:var(--serif);cursor:pointer;white-space:nowrap}
.stu-tag:hover{background:#F2C9BE}
/* 輪值教師：不能操作的東西就不要看起來可以點，也不要跳一堆提示 */
body.role-teacher [data-stu],body.role-teacher [data-slot],body.role-teacher [data-un],
body.role-teacher [data-day][data-key],body.role-teacher .stu-tag,
body.role-teacher [data-editday],body.role-teacher [data-toggle]{cursor:default}
body.role-teacher .stu-tag:hover{background:var(--seal-soft)}
/* 圖示按鈕：儲存打勾、編輯鉛筆、刪除叉叉 */
.icobtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink-2);
  cursor:pointer;padding:0}
.icobtn:hover{background:#FFF9EA;color:var(--ink)}
.icobtn.seal{background:var(--seal);border-color:var(--seal);color:#FBF1EC}
.icobtn.seal:hover{background:#8C2415}
.icobtn svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* 學生選單（輸入 90 開頭時浮出） */
.stu-pop{position:absolute;z-index:80;display:flex;flex-direction:column;min-width:210px;max-width:280px;
  background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:4px;
  box-shadow:0 10px 26px rgba(40,30,15,.22)}
.stu-pop button{border:0;background:transparent;text-align:left;padding:8px 10px;font-size:13px;
  font-family:var(--serif);letter-spacing:.04em;cursor:pointer;border-radius:4px;min-height:44px}
.stu-pop button:hover,.stu-pop button:focus{background:var(--seal-soft);color:#7E2415}
.icobtn:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.nt-acts .icobtn{flex:0 0 auto}
.ckbtn{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:48px;min-height:44px;
  background:transparent;border:0;padding:0 2px;cursor:pointer;border-radius:8px}
.ckbtn i{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:1px}
.ckbtn:hover .pill{border-color:var(--ink-3);color:var(--ink)}
.ckbtn:hover i{color:var(--ink)}
.ckbtn:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* ---------- 對話框 ---------- */
.overlay{position:fixed;inset:0;background:rgba(31,27,21,.5);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:0 20px 50px rgba(40,30,15,.35);
  width:min(560px,100%);max-height:92vh;overflow:auto}
.modal.wide{width:min(900px,100%)}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:15px;letter-spacing:.1em}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .foot{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.field input,.field select,.field textarea{border:1px solid var(--rule);border-radius:5px;padding:7px 10px;background:#FFFDF6;color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13px;cursor:pointer;color:var(--ink)}
.chk input{width:20px;height:20px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.days{display:flex;gap:6px}
.days button{flex:1;border:1px solid var(--rule);background:#FFFDF6;border-radius:5px;padding:9px 0;min-height:40px;cursor:pointer}
.days button.on{background:var(--ink);border-color:var(--ink);color:#FBF5E7}

/* ---------- 題簽：頁首標題區 ---------- */
.titleblock{display:flex;flex-direction:column;gap:2px}
.titleblock h1{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.14em}
.titleblock .meta{margin:0;font-size:11px;color:var(--ink-3);letter-spacing:.2em}
.when{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.crest{width:38px;height:38px;flex:none;align-self:center;border:2px solid var(--seal);border-radius:3px;color:var(--seal);display:grid;
  grid-template-columns:1fr 1fr;place-items:center;font-family:var(--serif);font-size:13px;font-weight:700;line-height:1;transform:rotate(-2.4deg)}

.brief{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:10px 14px;margin:0 0 12px}
.brief .row1{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink-2)}
.brief b{font-family:var(--serif);font-size:15px;color:var(--ink);margin:0 2px}
.brief .lv{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);display:flex;gap:14px;flex-wrap:wrap;
  align-items:baseline;font-size:13px}
.brief .lv i{font-style:normal;font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.brief .lv .none{color:var(--ink-3);font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:90}
.toast div{background:var(--ink);color:#FBF5E7;padding:8px 18px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.testlist{font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;gap:2px}
.testlist .ok{color:var(--ok)}
.testlist .ng{color:var(--seal)}

/* ---------- 設定頁：一區一件事，閱讀順序由上到下 ---------- */
.cfgwrap{display:flex;flex-direction:column;gap:14px;max-width:960px}
.cfgcard{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px 12px}
.cfgcard h3{margin:0 0 12px;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--ink)}
.cfgcard .lead{margin:0 0 14px;font-size:13px;line-height:1.9;color:var(--ink-2);max-width:66ch}
.cfgcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.cfgcols.one{grid-template-columns:minmax(0,1fr)}
.cfgopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.cfgopts .field{margin-bottom:0 !important}
.cfgcard .hint{margin:10px 0 0;line-height:1.85;max-width:66ch}
.cfgcard .hint:empty{display:none}
.cfgfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.cfgfoot.seam{padding-top:14px;border-top:1px solid var(--rule-soft)}
.cfgfoot .spacer{flex:1 1 auto}
.cfgcard .testlist{margin-top:12px}
.cfgcard-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.cfgcard-h h3{margin:0}
.cfgduo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:820px){
  .cfgcols,.cfgopts{grid-template-columns:minmax(0,1fr)}
  .cfgcard{padding:14px 14px 12px}
  .cfgcard .lead,.cfgcard .hint{max-width:none}
  .cfgduo{grid-template-columns:minmax(0,1fr)}
}

/* ---------- 窄螢幕 ---------- */
/* 學生清單卡片：只在窄螢幕出現 */
.cards{display:none}
.card{border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:10px 12px;
  display:flex;flex-direction:column;gap:8px}
.card.off{opacity:.72}
.card-h{display:flex;align-items:center;gap:8px}
.card .cbox{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;margin-left:-10px;cursor:pointer}
.card .cbox input{width:20px;height:20px;cursor:pointer}
.card-who{flex:1 1 auto;font-family:var(--serif);font-size:17px;letter-spacing:.04em;cursor:pointer}
.card-who b{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:400;margin-right:8px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .d5g{display:inline-grid;grid-template-columns:repeat(5,16px);justify-items:center;align-items:center;letter-spacing:0}
.card .d5g i{display:block;width:16px;font-style:normal;text-align:center;line-height:1;font-family:var(--mono);font-size:13px;color:#B4A68B}
.card .d5g i.on{color:var(--ink)}
.card-nums{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.card-nums b{font-family:var(--serif);font-size:14px;color:var(--ink)}
.card-foot{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-3)}
.card-foot .btn{margin-left:auto}
.card-reason{font-size:13px;line-height:1.75;color:var(--ink)}
.card-btns{display:flex;gap:8px;margin-left:auto}
.chk-inline{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:12px;color:var(--ink-2);cursor:pointer}
.chk-inline input{width:20px;height:20px;cursor:pointer}
#vioSum table{min-width:680px}
@media (max-width:1100px){
  .sheet{grid-template-columns:minmax(0,1fr)}
  .stats{display:none}
}
@media (max-width:860px){
  .sheet{grid-template-columns:minmax(0,1fr);border:0}
  .crest{width:36px;height:36px;font-size:12px;line-height:.92}
  .topline{gap:10px}
  .topline h1{font-size:17px}
  .titleblock h1{font-size:17px;letter-spacing:.06em}
  .topline .meta,.titleblock .meta{font-size:11px;letter-spacing:.06em}
  .topbar{padding:14px 14px 0}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tabs button{padding:9px 12px;white-space:nowrap}
  .page{padding:14px 14px 30px}
  /* 學生清單：窄螢幕改卡片，表格收起來 */
  #listTableWrap,#leaveTableWrap,#vioTableWrap{display:none}
  #listCards,#leaveCards,#vioCards{display:flex;flex-direction:column;gap:10px}
  /* 手機版點名列：一位學生最多兩行（座號姓名今夜／一到五方塊），電話備註收起來 */
  .ledger thead{display:none}
  .ledger tbody tr.person{display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr)) minmax(46px,auto);
    gap:4px 5px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--rule-soft)}
  .ledger tbody tr.person td{border:0;padding:0}
  .ledger .c{display:none}
  .ledger .s{grid-row:1;grid-column:1;font-size:12px;color:var(--ink-3);letter-spacing:.04em}
  .ledger .nm{grid-row:1;grid-column:2 / -1;font-size:16px;line-height:1.35;letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ledger td.note{display:none}
  /* 表頭在手機版收起來，改成每個方塊上方標星期，才知道哪一格是哪一天 */
  .ledger td.d{grid-row:2;position:relative;background:transparent;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
  .ledger td.d::before{font-size:9px;line-height:1;letter-spacing:0;color:var(--ink-3)}
  .ledger td.d:nth-of-type(4){grid-row:2;grid-column:1}
  .ledger td.d:nth-of-type(5){grid-row:2;grid-column:2}
  .ledger td.d:nth-of-type(6){grid-row:2;grid-column:3}
  .ledger td.d:nth-of-type(7){grid-row:2;grid-column:4}
  .ledger td.d:nth-of-type(8){grid-row:2;grid-column:5}
  .ledger td.d:nth-of-type(9){grid-row:2;grid-column:6;align-self:center}
  .ledger td.d:nth-of-type(4)::before{content:'一'}
  .ledger td.d:nth-of-type(5)::before{content:'二'}
  .ledger td.d:nth-of-type(6)::before{content:'三'}
  .ledger td.d:nth-of-type(7)::before{content:'四'}
  .ledger td.d:nth-of-type(8)::before{content:'五'}
  .ledger td.d:nth-of-type(9)::before{content:none}
  .ledger td.wk-hot::before{color:var(--seal);font-weight:700}
  .ledger td.d:nth-of-type(9) .ckbtn{min-width:44px;min-height:36px;padding:0 4px}
  .ledger td.d:nth-of-type(9) .ckbtn i{display:none}
  .ledger td.d .wkmk{display:none}
  .tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .ledger tr.band td{display:block;margin-bottom:2px;padding:10px 0 4px;font-size:12px;
    letter-spacing:.14em;background:transparent;border-top:2px solid var(--rule)}
  .ledger tbody:first-of-type tr.band td{border-top:0;padding-top:2px}
  .mkbtn{width:100%;max-width:40px;height:40px;border:1px solid var(--rule);border-radius:6px;font-size:14px}
  .ledger td.wk-hot .mkbtn{border-color:var(--seal)}
  /* 點名頁工具列：日期獨佔一行、兩顆動作鈕並排、說明文字自己一行，不再互相壓到 */
  #todayTools{gap:8px;align-items:stretch}
  #todayTools .daynav{flex:1 1 100%}
  #todayTools .daynav #refDate{flex:1 1 auto;min-width:0;font-size:15px;letter-spacing:.04em}
  #todayTools > .btn{flex:1 1 44%}
  #todayTools > span.hint{flex:1 1 100%;order:9;margin:2px 0 0;font-size:12px;line-height:1.75}
  /* 座位表：手機版縮小格子，保留橫向捲動 */
  .seatgrid{grid-template-columns:repeat(14,minmax(58px,1fr))}
  .seat{padding:14px 2px 3px}
  .seat .nm{font-size:12px;letter-spacing:0;white-space:nowrap}
  .seat .no{font-size:9px;left:3px}
  .seat .nm{font-size:11px;letter-spacing:0}
  .seat .sub,.seat .mn{font-size:9px;letter-spacing:0}
  .seat.tall{min-height:64px}
  .dayv{padding:12px 14px}
  .dv-head{gap:8px}
  .dv-act{margin-left:0;width:100%}
  /* 輪值記事編輯：手機改成上下堆疊，記事內容才有完整寬度 */
  .nt-edit{grid-template-columns:minmax(0,1fr);grid-template-areas:"time" "main" "acts";gap:10px}
  .nt-edit .nt-text{min-height:110px;font-size:15px;width:100%}
  .nt-edit .nt-acts{justify-content:flex-start}
  .nt-edit .nt-acts .icobtn{width:52px;height:44px}
  .nt .nt-time{width:100%;max-width:none}
  .nt-timechips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
}
/* 列印：只印 #printArea 裡的內容 */
#printArea{display:none}
#printArea .cut{border-top:.5pt solid #000;margin:3mm 0 0;height:8mm}
#printArea .tit{font-family:var(--serif);font-size:12pt;text-align:center;margin:0 0 4mm;letter-spacing:.12em}
#printArea table{border-collapse:collapse;width:100%}
#printArea th,#printArea td{border:1px solid #333;padding:2px 3px;text-align:center;font-size:9pt;
  font-family:var(--serif);line-height:1.4;vertical-align:middle}
#printArea th{background:#EDEDED;font-weight:700}
#printArea .printpage{margin-bottom:0}
#printArea .lian{border:1.2px solid #333;margin-bottom:4mm}
#printArea .lian .t{background:#EDEDED}
/* 套 Word 範本尺寸的列印表格 */
#printArea .wt{border-collapse:collapse;table-layout:fixed;width:100%;font-family:"標楷體","DFKai-SB",serif}
/* 座位表：版面比照 Word 範本（A3 橫式，15 欄、6 列） */
#printArea .seattit{font-family:"標楷體","DFKai-SB",serif;font-size:16pt;text-align:center;margin:0 0 2mm;letter-spacing:.05em}
#printArea .seatscr{width:1.104in;margin:0 auto 1.5mm;border:1pt solid #000;text-align:center;
  font-family:"標楷體",serif;font-size:11pt;padding:1pt 0}
#printArea table.seatmap{width:15.835in;margin:0 auto;border:2pt double #000;table-layout:fixed}
#printArea table.seatmap td{border:.5pt solid #000;padding:1pt 2pt;vertical-align:middle;text-align:center}
#printArea table.seatmap td.bandcell{font-family:"華康平劇體W7","標楷體",serif;font-size:14pt;font-weight:700;letter-spacing:.1em}
#printArea table.seatmap td.seatlb{font-family:"標楷體",serif;font-size:16pt;font-weight:700;line-height:1.1}
#printArea table.seatmap td.seatcell{font-family:"標楷體",serif;font-size:10pt;line-height:1.25;white-space:pre-line}
#printArea .wt td{border:.5pt solid #000;padding:.4mm 1mm;text-align:center;vertical-align:middle;
  font-size:9.5pt;line-height:1.2;font-family:"標楷體","DFKai-SB",serif}
#printArea .wt .vt{font-size:12pt;font-weight:700}
#printArea .wt .vl{text-align:left}
#printArea .wt .vh td{font-weight:700;background:#EDEDED}
#printArea .vio{margin:0;width:5.21in}
#printArea .duo{display:grid;grid-template-columns:5.22in 5.22in;column-gap:.24in;justify-content:center;align-items:start}
#printArea .duo .side{min-width:0}
#printArea .seatmap td{font-size:12pt;line-height:1.15;padding:0}
#printArea .seatmap .lbl{font-size:16pt;font-weight:700}
@media print{
  .sheet,#modalRoot,.toast,#tplPicker{display:none!important}
  body{background:#fff;background-image:none}
  #printArea{display:block!important}
  #printArea .pagebreak{break-after:page;page-break-after:always}
  #printArea .pagebreak:last-child{break-after:auto;page-break-after:auto}
}
/* ---------- 進站關卡：通關密語 ---------- */
body.gated{overflow:hidden}
body.gated .sheet{opacity:.28;pointer-events:none;user-select:none}
.gate{position:fixed;inset:0;z-index:9998;display:grid;place-items:center;padding:22px;
  background:radial-gradient(circle at 50% 18%, rgba(158,43,24,.10), rgba(158,43,24,0) 62%), var(--paper)}
.gate[hidden]{display:none}
.gate .box{width:min(400px,100%);background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:26px 24px 22px;text-align:center;box-shadow:0 18px 44px rgba(31,27,21,.16)}
.gate .crest{margin:0 auto 12px}
.gate h2{margin:0 0 4px;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.18em}
.gate .lead{margin:0 0 18px;font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.gate input{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;background:#FFFDF7;
  font-size:16px;letter-spacing:.14em;text-align:center;color:var(--ink)}
.gate input:focus{outline:2px solid var(--seal);outline-offset:1px}
.gate .go{width:100%;margin-top:12px;padding:12px 10px;min-height:48px;border:0;border-radius:6px;
  background:var(--seal);color:#FBF3E4;font-size:15px;letter-spacing:.24em;cursor:pointer}
.gate .go:disabled{opacity:.55;cursor:progress}
.gate .msg{min-height:20px;margin:10px 0 0;font-size:12px;line-height:1.7}
.gate .msg.ng{color:var(--seal)}
.gate .msg.ok{color:var(--ok)}
.gate .foot{margin:14px 0 0;font-size:11px;color:var(--ink-3);line-height:1.7}
/* 雲端試算表捷徑：右上角小圖示與設定頁的大顆按鈕共用同一套線條（細筆畫、跟著字色走），
   跟紙本與印章的調性一致，不用彩色貼圖 */
.ico{width:16px;height:16px;display:block;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cfgcard-h .sheetcue{flex:0 0 auto}
.sheetcue{display:inline-flex;align-items:center}
.sheetcue[hidden]{display:none}
.sheetcue a.sheetopen{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;
  border:1px solid var(--rule);border-radius:5px;background:var(--card);color:var(--ink-2);text-decoration:none;
  font-family:var(--serif);font-size:12px;letter-spacing:.08em;white-space:nowrap}
.sheetcue a.sheetopen:hover{border-color:var(--seal);color:var(--seal);background:#FFF9EA}
.sheetcue a.sheetopen:focus-visible{outline:2px solid var(--seal);outline-offset:1px}
.sheetcue a.sheetopen .ico{width:14px;height:14px}
.sheetcue .sheetmeta{font-size:12px;line-height:1.6;color:var(--ink-3)}
/* ---------- 分頁列 ---------- */
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;
  padding-top:10px;border-top:1px solid var(--rule-soft);font-size:13px;color:var(--ink-3)}
.pager .spacer{flex:1 1 auto}
.pager b{font-family:var(--serif);font-size:14px;color:var(--ink)}
.pager label{margin:0;font-size:12px}
.pager select{min-height:36px;padding:0 8px;border:1px solid var(--rule);border-radius:6px;
  background:var(--card);color:var(--ink);font-size:13px}
.pager .btn{min-height:36px}
.pager .btn[disabled]{opacity:.42;cursor:default}
/* ---------- 便當管理 ---------- */
.meal-sum{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 14px;padding:10px 14px;
  border:1px solid var(--rule-soft);border-radius:8px;background:var(--card)}
.meal-sum .m{display:flex;align-items:baseline;gap:6px}
.meal-sum .m b{font-family:var(--serif);font-size:20px;font-weight:600}
.meal-sum .m i{font-style:normal;font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.meal-sum .m.warn b{color:var(--seal)}
table.mealgrid{border-collapse:collapse;font-size:12px}
table.mealgrid th,table.mealgrid td{border:1px solid var(--rule-soft);padding:0;
  text-align:center;height:28px;min-width:26px;white-space:nowrap}
table.mealgrid th{background:var(--g-head);font-weight:700;color:var(--ink-2);font-size:11px;height:24px}
table.mealgrid th.d{color:var(--ink-3);font-size:10px;font-weight:400}
table.mealgrid th.we{background:var(--g-week);color:var(--ink-3);font-size:10px;font-weight:400;min-width:22px}
table.mealgrid th.hl{background:var(--g-head);color:var(--seal)}
table.mealgrid th.sub{background:var(--g-sub);min-width:34px}
table.mealgrid th.total{background:var(--g-total);min-width:66px}
table.mealgrid th.name,table.mealgrid th.cls,table.mealgrid th.seat,table.mealgrid th.grp{background:var(--g-head)}
table.mealgrid td{background:var(--card)}
table.mealgrid tr.band td{background:var(--g-band)}

<!-- 匯出用的大檔（ExcelJS、PizZip、docxtemplater 合計約 1.2 MB）改成第一次匯出才下載，
     開頁不必等它們，雲端名冊可以更早出現 -->
<script>
const LIB = {
  URLS: {
    exceljs: 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
    pizzip:  'https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.js',
    docx:    'https://cdn.jsdelivr.net/npm/docxtemplater@3.60.1/build/docxtemplater.js'
  },
  ready: { exceljs:false, pizzip:false, docx:false },
  waiting: {},
  load(key){
    if(this.ready[key]) return Promise.resolve(true);
    if(this.waiting[key]) return this.waiting[key];
    const self = this;
    this.waiting[key] = new Promise(function(resolve, reject){
      const s = document.createElement('script');
      s.src = self.URLS[key];
      s.async = true;
      s.onload = function(){ self.ready[key] = true; resolve(true); };
      s.onerror = function(){ delete self.waiting[key]; reject(new Error('下載 '+key+' 失敗，請確認網路後再匯出')); };
      document.head.appendChild(s);
    });
    return this.waiting[key];
  },
  async need(keys){
    for(let i=0;i<keys.length;i++) await this.load(keys[i]);
    return true;
  },
  warm(){
    const run = function(){ ['pizzip','docx','exceljs'].forEach(function(k){ LIB.load(k).catch(function(){}); }); };
    if(window.requestIdleCallback) requestIdleCallback(run, { timeout: 8000 });
    else setTimeout(run, 3000);
  }
};
</script>

/* =====================================================================
   3. PURE ENGINE
   ===================================================================== */
const E = {
  iso(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); },
  today(){ return E.iso(new Date()); },
  /* 可調參數：以試算表「設定」工作表的值優先，缺項才用程式預設值 */
  optsOf(st){
    const raw = (st && st.opts) || {}, out = {};
    const meta = (st && st.meta) || {};
    OPTS.forEach(function(d){
      const v = raw[d.key];
      const empty = v===undefined || v===null || String(v).trim()==='';
      let val = empty ? d.def : String(v).trim();
      if(empty && (d.key==='school' || d.key==='term') && meta[d.key]) val = String(meta[d.key]).trim();
      out[d.key] = val;
    });
    return out;
  },
  opt(st,key){ return E.optsOf(st)[key]; },
  optNum(st,key){
    const d = OPTS.find(function(o){ return o.key===key; });
    const n = Number(E.opt(st,key));
    if(isFinite(n) && n > 0) return n;
    return Number(d ? d.def : 1) || 1;
  },
  /* 常用清單的項目分隔用頓號或分號：像「打瞌睡，多次提醒」這種句子裡的逗號不會被切成兩個按鈕 */
  optList(st,key){
    return String(E.opt(st,key)||'').split(/[、；]/)
      .map(function(s){ return s.trim(); }).filter(Boolean);
  },
  parse(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); },
  wd(iso){ return E.parse(iso).getDay(); },
  isMonToFri(iso){ const w=E.wd(iso); return w>=1 && w<=5; },
  clsOf(key){ return Number(String(key).split('-')[0]); },
  seatOf(key){ return String(key).split('-')[1]; },
  byKey(st,key){ return st.students.find(s=>s.key===key) || null; },
  active(st){ return st.students.filter(s=>s.active!==false); },
  classes(st){ return [...new Set(st.students.map(s=>s.cls))].sort((a,b)=>a-b); },
  seatLabel(i){
    const slot = CONFIG.SEAT_SLOTS.find(s=>s.i===Number(i));
    if(!slot) return '';
    return (CONFIG.SEAT_GROUPS[slot.col-1] || '') + slot.band;
  },
  seatSide(st, i){
    const slot = CONFIG.SEAT_SLOTS.find(s=>s.i===Number(i));
    if(!slot) return '';
    const twins = CONFIG.SEAT_SLOTS.filter(s=>s.band===slot.band && s.col===slot.col);
    if(twins.length < 2) return '';
    const taken = twins.filter(s=>!!((st.seats||{})[String(s.i)])).length;
    return taken >= 2 ? (slot.row===0 ? '上' : '下') : '';
  },
  label(days){
    const d = Array.isArray(days) ? days : [0,0,0,0,0];
    return d.map((v,i)=>v?CONFIG.DAY_LABELS[i]:'').join('') || '不參加';
  },

  daysAt(st,key,iso){
    const base = E.byKey(st,key);
    if(!base) return [0,0,0,0,0];
    const hits = (st.enrollments||[]).filter(e=>e.key===key && e.date<=iso)
      .sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
    return hits.length ? hits[hits.length-1].days.slice() : base.days.slice();
  },
  daysNow(st,key){
    const base = E.byKey(st,key);
    if(!base) return [0,0,0,0,0];
    const hits = (st.enrollments||[]).filter(e=>e.key===key)
      .sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
    return hits.length ? hits[hits.length-1].days.slice() : base.days.slice();
  },
  /* 這個日期之後才生效的異動，用來標示「之後已改」，不會動到當天 */
  /* 這個日期之後才生效的異動，用來標示「之後已改」，不會動到當天。
     回傳時一併補上 from（變更前那一天生效的設定），畫面才說得出「A 改成 B」。 */
  changesAfter(st,key,iso){
    let prev = E.daysAt(st,key,iso);
    return (st.enrollments||[]).filter(e=>e.key===key && e.date>iso)
      .sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0))
      .map(function(e){
        const days = Array.isArray(e.days) ? e.days : [0,0,0,0,0];
        const from = Array.isArray(e.from) ? e.from : prev;
        const out = Object.assign({}, e, { days: days, from: from });
        prev = days;
        return out;
      });
  },
  isSchoolDay(st,iso){
    const c = (st.calendar||[]).find(x=>x.date===iso);
    if(c) return c.status==='上課' || c.status==='段考';
    return E.isMonToFri(iso);
  },
  calLabel(st,iso){ const c=(st.calendar||[]).find(x=>x.date===iso); return c?c.label:''; },
  present(st,key,iso){
    const w = E.wd(iso);
    if(w<1||w>5) return false;
    if(!E.isSchoolDay(st,iso)) return false;
    return E.daysAt(st,key,iso)[w-1]===1;
  },
  /* 這一天有沒有排夜自習：要是上課日，而且至少一位學生排了這天 */
  hasSchedule(st,iso){
    if(!E.isSchoolDay(st,iso)) return false;
    return E.active(st).some(function(s){ return E.present(st, s.key, iso); });
  },
  /* 往前或往後找最近一個有排夜自習的日期；找不到回空字串 */
  stepScheduled(st,from,dir,maxDays){
    const limit = maxDays || 120;
    for(let i=1; i<=limit; i++){
      const d = E.parse(from);
      d.setDate(d.getDate() + dir*i);
      const iso = E.iso(d);
      if(E.hasSchedule(st, iso)) return iso;
    }
    return '';
  },
  onLeave(st,key,iso){ return (st.leaves||[]).some(l=>l.key===key&&l.date===iso); },
  checkin(st,key,iso){ const c=(st.checkins||[]).find(x=>x.key===key&&x.date===iso); return c?c.status:''; },
  board(st,iso){
    const out={should:[],leave:[],in:[],absent:[]};
    for(const s of E.active(st)){
      if(!E.present(st,s.key,iso)) continue;
      out.should.push(s);
      if(E.onLeave(st,s.key,iso)){ out.leave.push(s); continue; }
      if(E.checkin(st,s.key,iso)==='到') out.in.push(s); else out.absent.push(s);
    }
    return out;
  },
  matrix(st,iso){
    const rows = E.classes(st).map(cls=>{
      const list = E.active(st).filter(s=>s.cls===cls);
      const per=[0,0,0,0,0];
      list.forEach(s=>{ const d=E.daysAt(st,s.key,iso); for(let i=0;i<5;i++) if(d[i]) per[i]++; });
      const total = st.students.filter(s=>s.cls===cls).length || Number((st.config.totals||{})[cls]) || list.length;
      const joined = list.filter(s=>E.daysNow(st,s.key).some(v=>v===1)).length;
      return { cls, per, total, joined, notJoined: Math.max(total-joined,0) };
    });
    return { rows, total: rows.reduce((a,b)=>a+b.total,0), joined: rows.reduce((a,b)=>a+b.joined,0),
             notJoined: rows.reduce((a,b)=>a+b.notJoined,0) };
  },
  historyOf(st,key){
    return (st.enrollments||[]).filter(e=>e.key===key)
      .sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0))
      .map((e,i,arr)=>{
        const prev = i>0 ? arr[i-1].days : (e.from || E.byKey(st,key).days);
        return { ...e, before: prev, after: e.days };
      });
  },
  recentLog(st,limit){
    const all = [];
    (st.enrollments||[]).forEach((e, i)=>{
      const key = e.key;
      const list = E.historyOf(st,key);
      const idx = list.findIndex(x=>x.id===e.id);
      const before = e.from || (idx>0 ? list[idx-1].after : (E.byKey(st,key)||{days:[0,0,0,0,0]}).days);
      all.push({ ...e, before, after: e.days, order: i });
    });
    all.sort((a,b)=> b.date.localeCompare(a.date) || (b.order - a.order));
    return limit ? all.slice(0,limit) : all;
  },
  weekOf(iso){
    const d = E.parse(iso);
    const w = d.getDay();
    const back = (w===0?6:w-1);
    const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate()-back);
    const out=[];
    for(let i=0;i<5;i++){
      const x = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i);
      out.push(E.iso(x));
    }
    return out;
  },
  weekRows(st,iso){
    return E.weekOf(iso).map((date,i)=>{
      const b = E.board(st,date);
      const vio = (st.violations||[]).filter(v=>v.date===date);
      const rec = (st.duty||[]).find(d=>d.date===date) || {};
      return { date, wd:CONFIG.DAY_LABELS[i], teacher:rec.teacher||'', note:rec.note||'',
               should:b.should.length, leave:b.leave.length, in:b.in.length,
               absent:b.absent.length, vio:vio.length, school:E.isSchoolDay(st,date),
               label:E.calLabel(st,date) };
    });
  },
  seatRows(st){
    return E.active(st).map(s=>({ cls:s.cls, seat:s.seat, name:s.name, days:E.daysNow(st,s.key), key:s.key }))
      .sort((a,b)=> a.cls-b.cls || a.seat.localeCompare(b.seat));
  },
  seatCard(st,key){
    if(!key) return '';
    const s = E.byKey(st,key);
    if(!s) return '';
    const d = E.daysNow(st,key);
    /* 四行：星期列、勾選列、班級座號、姓名。班級座號自己一行，格子才不會被撐寬 */
    return '一二三四五\n'
      + d.map(v=>v?'■':'□').join('') + '\n'
      + s.cls + s.seat + '\n'
      + s.name;
  },
  /* 一格可容納兩位（上下），下位存在 st.seatPair */
  seatKeys(st,i){
    const a = (st.seats||{})[String(i)] || '';
    const b = (st.seatPair||{})[String(i)] || '';
    return [a, b].filter(Boolean);
  },
  daysOverlap(st, a, b){
    if(!a || !b) return false;
    const x = E.daysNow(st,a), y = E.daysNow(st,b);
    for(let i=0;i<5;i++) if(x[i] && y[i]) return true;
    return false;
  },
  /* 匯出用：一格只有一位就是那張座位卡；一格擠兩位（上下）才分成上下兩段，
     兩段之間畫一條分隔線（不寫「上／下」字樣）。 */
  seatCell(st,i){
    const keys = E.seatKeys(st,i);
    if(!keys.length) return '';
    const cards = keys.map(function(k){ return E.seatCard(st, k); });
    return cards.join('\n' + E.cellRule + '\n');
  },
  /* 匯出用：一桌一格。一位就是那張卡；上下兩位就分成兩段，中間畫一條分隔線 */
  deskCell(st, deskNo){
    const desk = CONFIG.DESKS[deskNo - 1];
    if(!desk) return '';
    const cards = [];
    desk.slots.forEach(function(i){
      E.seatKeys(st, i).forEach(function(k){
        const card = E.seatCard(st, k);
        if(card) cards.push(card);
      });
    });
    return cards.join('\n' + E.cellRule + '\n');
  },
  /* 上下兩位之間的分隔線：一整排橫線，看起來就是格線 */
  cellRule: '──────',
  seatIssue(st){
    const used={}, dup=[];
    const mark = k=>{ if(!k) return; if(used[k]) dup.push(k); else used[k]=true; };
    Object.values(st.seats||{}).forEach(mark);
    Object.values(st.seatPair||{}).forEach(mark);
    const unseated = E.active(st).filter(s=>!used[s.key]).map(s=>s.key);
    return { dup, unseated };
  },
  rocDate(iso){
    const d = E.parse(iso), roc = d.getFullYear()-1911;
    return '民國    '+roc+'   年   '+(d.getMonth()+1)+'   月    '+d.getDate()+'  日 星期   '+CONFIG.WEEKDAY[d.getDay()]+'   ';
  },
  studentLine(st,key){
    const cls = E.clsOf(key), grade = Math.floor(cls/100), room = cls%100;
    const s = E.byKey(st,key), seat = E.seatOf(key);
    const pad = seat.length>=2 ? seat : ' '+seat;
    return '   '+grade+'  年  '+room+'   班 座號   '+pad+'   姓名       '+(s?s.name:'')+'      ';
  },
  /* 違規事由後面自動附上記點數，避免重複附加 */
  vioReason(v){
    const raw = String((v && v.reason) || '').replace(/[（(]\s*記\s*\d+\s*點\s*[）)]\s*$/, '').trim();
    if(/記\s*\d+\s*點/.test(raw)) return raw;
    return raw + '（記' + ((v && Number(v.points)) || 1) + '點）';
  },
  /* 各生累積違規點數，依點數由多到少 */
  vioTotals(st){
    const m = {};
    (st.violations || []).forEach(function(v){
      const p = Number(v.points) || 1;
      const cur = m[v.key] || (m[v.key] = { key: v.key, n: 0, p: 0, last: '' });
      cur.n += 1;
      cur.p += p;
      if (v.date > cur.last) cur.last = v.date;
    });
    return Object.keys(m).map(function(k){ return m[k]; })
      .sort(function(a, b){ return b.p - a.p || a.key.localeCompare(b.key); });
  },
  vioItems(st,ids){
    const list = (st.violations||[]).filter(v=>ids.includes(v.id))
      .sort((a,b)=> a.date.localeCompare(b.date) || a.key.localeCompare(b.key));
    return list.map((v,i)=>({
      dateLine: E.rocDate(v.date),
      studentLine: E.studentLine(st,v.key),
      reason: v.reason,
      reason: E.vioReason(v),
    }));
  },
  vioPages(st,ids){
    const items = E.vioItems(st,ids);
    const pairs = [], tail = [];
    let i = 0;
    for(; i+1 < items.length; i += 2) pairs.push({ left: items[i], right: items[i+1] });
    if(i < items.length) tail.push({ left: items[i] });
    return { pairs: pairs, tail: tail };
  },
  /* 給 Word 範本用的攤平資料：左右各一組欄位，最後一位落單時放進 tail */
  vioDoc(st,ids){
    const b = E.vioPages(st,ids);
    const pages = b.pairs.map(function(p, idx){
      return {
        L_dateLine:p.left.dateLine, L_studentLine:p.left.studentLine, L_reason:p.left.reason,
        R_dateLine:p.right.dateLine, R_studentLine:p.right.studentLine, R_reason:p.right.reason,
        brk: idx < b.pairs.length-1 || b.tail.length > 0
      };
    });
    const tail = b.tail.map(function(t){
      return { L_dateLine:t.left.dateLine, L_studentLine:t.left.studentLine, L_reason:t.left.reason };
    });
    return { pages: pages, tail: tail };
  },
};

/* ---------- 便當（純函式：零 DOM、零網路，畫面與匯出共用同一套判定） ---------- */
E.meal = {
  PRICE_DEF: 100,
  WEEK: ['一','二','三','四','五'],

  /* 單價以可調參數為準；沒填或填壞就回預設 100 */
  price(st){
    const n = Number(E.opt(st,'mealPrice'));
    return (isFinite(n) && n > 0) ? Math.round(n) : E.meal.PRICE_DEF;
  },
  ym(iso){ return String(iso||'').slice(0,7); },
  /* 2026-10 → 10月份 */
  ymText(ym){
    const p = String(ym||'').split('-');
    return (Number(p[1]) || 0) + '月份';
  },
  /* 2026-10 → 2026年10月 */
  ymLabel(ym){
    const p = String(ym||'').split('-');
    return (p[0]||'') + '年' + (Number(p[1]) || 0) + '月';
  },
  /* 上一個月／下一個月 */
  shiftYm(ym, dir){
    const p = String(ym||'').split('-').map(Number);
    const d = new Date(p[0] || 2000, (p[1] || 1) - 1 + dir, 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  },

  /* 收費期：預設整個月；可以個別指定起訖日（例如 12 月從 11/30 起算）。
     沒指定時，若上一期有指定結束日，就自動從隔天接下去，不會漏也不會重複。 */
  period(st, ym){
    const map = (st.config && st.config.mealPeriods) || {};
    const p = String(ym||'').split('-').map(Number);
    const y = p[0], m = p[1];
    if(!y || !m) return { ym:ym || '', from:'', to:'', custom:false };
    const pad = function(n){ return String(n).padStart(2,'0'); };
    const defFrom = y + '-' + pad(m) + '-01';
    const defTo = y + '-' + pad(m) + '-' + pad(new Date(y, m, 0).getDate());
    const rec = map[ym];
    if(rec && rec.from && rec.to) return { ym:ym, from:rec.from, to:rec.to, custom:true };
    let from = defFrom;
    const prev = map[E.meal.shiftYm(ym, -1)];
    if(prev && prev.to){
      const d = E.parse(prev.to);
      const next = E.iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1));
      if(next > from && next <= defTo) from = next;
    }
    /* 下一期已經指定起日時，這一期自動收到前一天，兩期不會重疊 */
    let to = defTo;
    const nx = map[E.meal.shiftYm(ym, 1)];
    if(nx && nx.from){
      const d2 = E.parse(nx.from);
      const before = E.iso(new Date(d2.getFullYear(), d2.getMonth(), d2.getDate() - 1));
      if(before < to && before >= from) to = before;
    }
    return { ym:ym, from:from, to:to, custom:false };
  },
  setPeriod(st, ym, from, to){
    st.config = st.config || {};
    st.config.mealPeriods = st.config.mealPeriods || {};
    if(!from && !to){ delete st.config.mealPeriods[ym]; return; }
    st.config.mealPeriods[ym] = { from:from || '', to:to || '' };
  },
  /* 這一天算在哪一期 */
  ownerYm(st, iso){
    const ym = E.meal.ym(iso);
    const per = E.meal.period(st, ym);
    if(iso >= per.from && iso <= per.to) return ym;
    const nx = E.meal.shiftYm(ym, 1), np = E.meal.period(st, nx);
    if(iso >= np.from && iso <= np.to) return nx;
    const pv = E.meal.shiftYm(ym, -1), pp = E.meal.period(st, pv);
    if(iso >= pp.from && iso <= pp.to) return pv;
    return ym;
  },
  /* 夜自習起訖日：設了就只算這段期間，沒設就不限 */
  inTerm(st, iso){
    const a = String(E.opt(st,'nsStart')||'').trim();
    const b = String(E.opt(st,'nsEnd')||'').trim();
    if(a && iso < a) return false;
    if(b && iso > b) return false;
    return true;
  },
  /* 收費期的第一天（可能落在上一個月，例如 12 月從 11/30 起算） */
  periodStart(st, ym){
    return E.meal.period(st, ym).from || (String(ym||'') + '-01');
  },

  /* 該收費期的所有上課日，依週分組；每週固定五格，跨到隔壁月的日子也會列進來。
     假日與夜自習起訖日以外的日子標 holiday（不供餐也不計費）。 */
  month(st, ym){
    const per = E.meal.period(st, ym);
    if(!per.from || !per.to) return { ym:ym || '', weeks:[], days:[], schoolDays:0, period:per };
    const weeks = [], at = {};
    let d = E.parse(per.from), guard = 0;
    while(E.iso(d) <= per.to && guard++ < 400){
      const iso = E.iso(d), w = E.wd(iso);
      if(w >= 1 && w <= 5){
        const mon = E.iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - (w - 1)));
        if(!at[mon]){ at[mon] = { mon:mon, slots:[null,null,null,null,null] }; weeks.push(at[mon]); }
        at[mon].slots[w-1] = { iso:iso, day:d.getDate(), wd:w,
          holiday:(!E.isSchoolDay(st, iso) || !E.meal.inTerm(st, iso)),
          label:E.calLabel(st, iso) };
      }
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
    const days = [];
    weeks.forEach(function(wk){ wk.slots.forEach(function(sl){ if(sl) days.push(sl); }); });
    return { ym:ym, weeks:weeks, days:days, period:per,
      schoolDays: days.filter(function(x){ return !x.holiday; }).length };
  },

  /* 該生第一次「加入夜自習」的日期；沒有加入紀錄就當作本來就在 */
  startIso(st, key){
    const joins = (st.enrollments||[]).filter(function(e){ return e.key === key && e.kind === 'join'; });
    if(!joins.length) return '';
    return joins.map(function(e){ return e.date; }).sort()[0];
  },
  /* 該生「月初當時」的參加設定：月中退出或改時間，原本排過的日子還算得出來 */
  baseDays(st, key, ym){
    const day1 = E.meal.periodStart(st, ym);
    const first = E.meal.startIso(st, key);
    if(first && first > day1) return [0,0,0,0,0];   /* 這個收費月才加入，月初還沒有他 */
    return E.daysAt(st, key, day1);
  },
  /* 該月有沒有排定過（含月中被減掉的日子）：決定名單留不留 */
  hadPlan(st, key, ym){
    const mo = E.meal.month(st, ym), base = E.meal.baseDays(st, key, ym);
    const first = E.meal.startIso(st, key);
    return mo.days.some(function(d){
      if(first && d.iso < first) return false;
      if(base[d.wd-1] === 1) return true;
      return E.daysAt(st, key, d.iso)[d.wd-1] === 1;
    });
  },

  /* 訂便當的人：夜自習名單預設全部帶入，只有便當欄填「不訂」的才排除；
     便當欄留空就當作要訂。月中退出夜自習的人，這個月仍留在名單，下個月自動消失。 */
  roster(st, ym){
    const out = [], seen = {};
    (st.students||[]).forEach(function(s){
      const lunch = String(s.lunch||'').trim();
      const off = s.active === false;
      const noOrder = (!lunch || lunch === '不訂');
      /* 不訂的人只有真的加訂過才列進來，不然整月都會被算錢 */
      const added = noOrder && (st.meals||[]).some(function(m){
        return m.key === s.key && m.kind === '加訂' && (!ym || E.meal.ym(m.date) === ym);
      });
      if(noOrder && !added) return;
      const plan = ym ? E.meal.hadPlan(st, s.key, ym) : !off;
      if(!plan && !added) return;                         /* 這個月沒排夜自習就不列 */
      if(seen[s.key]) return;
      seen[s.key] = 1;
      out.push({ key:s.key, cls:Number(s.cls)||0, seat:s.seat||'', name:s.name||'',
        lunch:lunchText(lunch) || '訂', group:'夜自習', note:s.note || '', active:!off });
    });
    (st.mealMembers||[]).forEach(function(s){
      if(seen[s.key]) return;
      seen[s.key] = 1;
      out.push({ key:s.key, cls:Number(s.cls)||0, seat:s.seat||'', name:s.name||'',
        lunch:lunchText(s.lunch) || '訂', group:'數學班', note:s.note || '', active:true,
        from:String(s.from||'').trim() });
    });
    return out.sort(function(a,b){
      return (a.cls - b.cls) || String(a.seat).localeCompare(String(b.seat)) || a.key.localeCompare(b.key);
    });
  },
  byKey(st, key, ym){
    return E.meal.roster(st, ym).find(function(m){ return m.key === key; }) || null;
  },

  /* 計費基礎：當天有排、或月初曾經有排，都算。
     月中被減掉的日子不是「不算」，而是「先預收、再退費」。 */
  planned(st, member, iso){
    if(!member) return false;
    const w = E.wd(iso);
    if(w < 1 || w > 5) return false;
    if(!E.isSchoolDay(st, iso)) return false;
    if(!E.meal.inTerm(st, iso)) return false;
    if(member.group === '數學班'){
      if(member.from && iso < member.from) return false;
      return w === 1;
    }
    if(member.lunch === '不訂') return false;   /* 不訂的人只有加訂那一天才算 */
    const first = E.meal.startIso(st, member.key);
    if(first && iso < first) return false;   /* 他還沒加入，不能算他的 */
    if(E.daysAt(st, member.key, iso)[w-1] === 1) return true;
    return E.meal.baseDays(st, member.key, E.meal.ownerYm(st, iso))[w-1] === 1;
  },
  dropped(st, member, iso){
    if(!member || member.group === '數學班') return false;
    const w = E.wd(iso);
    if(w < 1 || w > 5) return false;
    if(!E.isSchoolDay(st, iso)) return false;
    if(!E.meal.inTerm(st, iso)) return false;
    const first = E.meal.startIso(st, member.key);
    if(first && iso < first) return false;
    if(E.daysAt(st, member.key, iso)[w-1] === 1) return false;
    return E.meal.baseDays(st, member.key, E.meal.ownerYm(st, iso))[w-1] === 1;
  },
  rec(st, key, iso){
    return (st.meals||[]).find(function(m){ return m.key === key && m.date === iso; }) || null;
  },

  /* 每一天的狀態：add 加訂、take 帶走（不退）、refund 退費、on 正常供餐、off 不供餐。
     refund 會帶 why：leave 請假、drop 月中退出或改時間、manual 手動標的。 */
  day(st, member, iso){
    const r = E.meal.rec(st, member.key, iso);
    if(r && r.kind === '加訂') return { mode:'add', charge:1, manual:true, rec:r };
    if(r && r.kind === '帶走') return { mode:'take', charge:1, manual:true, rec:r };
    if(r && r.kind === '退費') return { mode:'refund', charge:0, manual:true, rec:r,
      paid:r.status === '已退', why:'manual' };
    if(!E.meal.planned(st, member, iso)) return { mode:'off', charge:0, manual:false };
    if(E.meal.dropped(st, member, iso)) return { mode:'refund', charge:0, manual:false, paid:false, why:'drop' };
    if(E.onLeave(st, member.key, iso)) return { mode:'refund', charge:0, manual:false, paid:false, why:'leave' };
    return { mode:'on', charge:1, manual:false };
  },
  /* 匯出用的格子值：1、V 或空白（Excel 只認這三種） */
  mark(st, member, iso){
    const d = E.meal.day(st, member, iso);
    if(!d.charge) return '';
    return d.mode === 'take' ? 'V' : '1';
  },
  /* 網頁格子顯示：把請假、待退、已退也標出來 */
  cellText(st, member, iso){
    const d = E.meal.day(st, member, iso);
    if(d.mode === 'on' || d.mode === 'add') return '1';
    if(d.mode === 'take') return 'V';
    if(d.mode === 'refund'){
      if(d.paid) return '退';
      return d.why === 'leave' ? '假' : '變';
    }
    return '';
  },

  /* 一位訂餐者在某個收費期的結算 */
  /* 調整：整體加收、整體退費、折抵下期 */
  adjusts(st, ym){
    return (st.mealAdjusts||[]).filter(function(a){ return a.ym === ym; });
  },
  adjustHit(st, adj, member){
    if(adj.scope === 'keys') return (adj.keys||[]).indexOf(member.key) >= 0;
    if(adj.scope === 'day'){
      if(!adj.day) return false;
      return E.meal.day(st, member, adj.day).charge === 1;
    }
    return true;   /* all：這期有訂餐的人 */
  },
  /* 這一期真的算進帳單的調整（折抵的留到下期） */
  adjustOf(st, member, ym){
    let n = 0;
    E.meal.adjusts(st, ym).forEach(function(a){
      if(a.settle === 'carry') return;
      if(E.meal.adjustHit(st, a, member)) n += Number(a.amount) || 0;
    });
    return n;
  },
  /* 上一期標成折抵的調整，這一期扣回來（負數代表少收） */
  carryOf(st, member, ym){
    let n = 0;
    E.meal.adjusts(st, E.meal.shiftYm(ym, -1)).forEach(function(a){
      if(a.settle !== 'carry') return;
      if(E.meal.adjustHit(st, a, member)) n += Number(a.amount) || 0;
    });
    return n;
  },

  bill(st, member, ym){
    const mo = E.meal.month(st, ym), price = E.meal.price(st);
    let planned = 0, refundN = 0, refundPaidN = 0, take = 0, add = 0, dropN = 0;
    mo.days.forEach(function(d){
      const x = E.meal.day(st, member, d.iso);
      const base = E.meal.planned(st, member, d.iso);
      if(x.mode === 'add'){
        if(base) planned++; else add++;
        return;
      }
      if(!base) return;
      planned++;
      if(x.mode === 'take') take++;
      else if(x.mode === 'refund'){
        refundN++;
        if(x.why === 'drop') dropN++;
        if(x.paid) refundPaidN++;
      }
    });
    const served = planned - refundN + add;
    const pre = planned * price;
    const dueRefund = refundN * price;
    const paid = refundPaidN * price;
    const extra = add * price;
    const adjust = E.meal.adjustOf(st, member, ym);
    const carry = E.meal.carryOf(st, member, ym);
    return {
      key:member.key, cls:member.cls, seat:member.seat, name:member.name,
      group:member.group, lunch:member.lunch, active:member.active !== false,
      planned:planned, refundN:refundN, refundPaidN:refundPaidN, take:take, add:add, dropN:dropN,
      served:served, price:price, pre:pre, dueRefund:dueRefund, paid:paid, extra:extra,
      adjust:adjust, carry:carry,
      net:pre - paid + extra + adjust + carry, waitN:refundN - refundPaidN,
      charge:served * price + adjust + carry
    };
  },


  /* 預繳單的算法：預繳單在前一個月發，那時候請假、月中退出、加訂、當月調整都還沒發生，
     所以只認「月初排定的份數」，退費一律留到下個月再處理。
     上期已確定的折抵是發單前就知道的金額，照樣扣掉。 */
  preBill(st, member, ym){
    const mo = E.meal.month(st, ym), price = E.meal.price(st);
    let days = 0;
    mo.days.forEach(function(d){
      if(E.meal.planned(st, member, d.iso)) days++;
    });
    const carry = E.meal.carryOf(st, member, ym);
    return { days:days, price:price, carry:carry, amount:days * price + carry };
  },
  /* 整班／全校合計 */
  summary(st, ym){
    const rows = E.meal.roster(st, ym).map(function(m){ return E.meal.bill(st, m, ym); });
    const sum = { kids:0, mKids:0, days:0, served:0, pre:0, dueRefund:0, paid:0, extra:0,
      net:0, waitN:0, waitMoney:0, dropN:0, adjust:0, carry:0 };
    rows.forEach(function(b){
      if(!b.planned && !b.add) return;
      sum.kids++;
      if(b.group === '數學班') sum.mKids++;
      sum.served += b.served;
      sum.pre += b.pre;
      sum.dueRefund += b.dueRefund;
      sum.paid += b.paid;
      sum.extra += b.extra;
      sum.adjust += b.adjust || 0;
      sum.carry += b.carry || 0;
      sum.net += b.net;
      sum.waitN += b.waitN;
      sum.dropN += b.dropN;
    });
    sum.waitMoney = sum.dueRefund - sum.paid;
    sum.days = E.meal.month(st, ym).schoolDays;
    return { rows:rows, sum:sum };
  },

  /* 該月還沒處理的退費：請假、月中退出或改時間、手動標的，只要還沒退就列出來 */
  pending(st, ym){
    const mo = E.meal.month(st, ym), out = [];
    E.meal.roster(st, ym).forEach(function(m){
      mo.days.forEach(function(d){
        const x = E.meal.day(st, m, d.iso);
        if(x.mode !== 'refund' || x.paid) return;
        let why = '手動退費';
        if(x.why === 'drop'){
          why = (m.active === false) ? '月中退出夜自習' : '月中改參加時間';
        }else if(x.why === 'leave'){
          const lv = (st.leaves||[]).find(function(l){ return l.key === m.key && l.date === d.iso; });
          why = (lv && lv.reason) || '請假';
        }else if(x.rec && x.rec.note){
          why = x.rec.note;
        }
        out.push({ member:m, iso:d.iso, id:(x.rec && x.rec.id) || '', why:why });
      });
    });
    return out.sort(function(a,b){
      return a.iso.localeCompare(b.iso) || (a.member.cls - b.member.cls)
        || String(a.member.seat).localeCompare(String(b.member.seat));
    });
  },

  /* 這個收費期的繳費截止說明與繳交對象（可調參數，留空就自動給合理預設） */
  payDue(st, ym){
    const v = String(E.opt(st,'mealPayDue')||'').trim();
    if(v) return v;
    const mo = E.meal.month(st, ym);
    const last = mo.days.filter(function(d){ return !d.holiday; }).pop();
    if(!last) return '本月最後一個上課日 前';
    return (E.parse(last.iso).getMonth()+1) + '/' + last.day + '（' + CONFIG.WEEKDAY[last.wd] + '） 前';
  },
  payTo(st){
    return String(E.opt(st,'mealPayTo')||'').trim() || '各班導師';
  }
};

/* =====================================================================
   4. API
   ===================================================================== */
const API = {
  /* 網址已內建；測試注入（window.SEED／__NS_LOCAL）或本機模式旗標時不連雲端 */
  isCloud(){ return !!CONFIG.GAS_URL && !CONFIG.LOCAL_ONLY && !window.SEED && !window.__NS_LOCAL; },
  reachable(){ return API.isCloud() && !!CONFIG.PASSWORD; },
  /* 單次請求：多了逾時中斷，網路卡住時不會讓整個畫面一直空等 */
  NET_TIMEOUT: 18000,
  lastMs: 0,
  async raw(payload, timeoutMs){
    const ms = timeoutMs || API.NET_TIMEOUT;
    const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
    const opts = {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, cache:'no-store',
      body: JSON.stringify({ ...payload, password: CONFIG.PASSWORD })
    };
    let timer = null;
    if(ctl){ opts.signal = ctl.signal; timer = setTimeout(function(){ try{ ctl.abort(); }catch(err){} }, ms); }
    const t0 = Date.now();
    try{
      const res = await fetch(CONFIG.GAS_URL, opts);
      const text = await res.text();
      let json;
      try{ json = JSON.parse(text); }
      catch(err){
        /* Apps Script 忙碌或轉址出錯時會回 HTML，這裡換成人看得懂的說明 */
        throw new Error('雲端回了無法解析的內容（HTTP ' + res.status + '），請稍後再試');
      }
      if(!json.ok) throw new Error(json.error || '雲端回應錯誤');
      json.ms = Date.now() - t0;
      return json;
    }catch(err){
      if(err && err.name === 'AbortError') throw new Error('連線逾時 '+Math.round(ms/1000)+' 秒');
      const m = String((err && err.message) || '');
      if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)){
        throw new Error(navigator.onLine === false ? '目前沒有網路' : '連不上雲端，網路可能不穩');
      }
      throw err;
    }finally{
      if(timer) clearTimeout(timer);
    }
  },
  /* 讀取類動作自動重試（間隔 0.9 秒、2.4 秒、5 秒）；寫入不重試，避免重複寫入 */
  async call(payload, o){
    o = o || {};
    const tries = o.tries || (payload.action === 'saveAll' ? 1 : 3);
    const gaps = [0, 900, 2400, 5000];
    let last = null;
    for(let i=0;i<tries;i++){
      if(gaps[i]) await new Promise(function(r){ setTimeout(r, gaps[i]); });
      try{
        const json = await API.raw(payload, o.timeoutMs);
        API.lastMs = json.ms;
        if(PERF) console.log('[GAS] ' + payload.action + '：' + json.ms + ' ms（後端 '
          + (json.serverMs || 0) + ' ms' + (json.cached ? '，快取命中' : '') + '）');
        return json;
      }catch(err){
        last = err;
        const m = String((err && err.message) || '');
        /* 密語不對或回應格式壞掉，重試也沒用 */
        if(/通關密語不正確|後端還沒設定通關密語|無法解析/.test(m)) break;
        if(o.onRetry) o.onRetry(i+1, err);
      }
    }
    throw last || new Error('雲端沒有回應');
  },
  async load(o){
    o = o || {};
    if(!API.reachable()){ return { ok:false }; }
    const payload = { action:'loadAll' };
    if(o.fresh === true) payload.fresh = true;
    else if(o.generation) payload.generation = o.generation;
    const json = await API.call(payload, { onRetry:o.onRetry, tries:o.tries });
    cloud.loaded = true;
    cloud.failed = false;
    /* 後端會順便回報這份資料放在哪一份試算表，管理介面的圖示連結就靠它 */
    if(json.sheet) cloud.sheet = json.sheet;
    return { ok:true, notModified:!!json.notModified, state:json.state, generation:json.generation,
             cached:!!json.cached, ms:json.ms, serverMs:json.serverMs, sheet:json.sheet || null };
  },
  /* 這份畫面各項目的指紋：用來算「這次到底改了哪幾項」 */
  snapshot(){
    const snap = {};
    SYNC_PARTS.forEach(function(k){ snap[k] = JSON.stringify(state[k] === undefined ? null : state[k]); });
    return snap;
  },
  /* 回傳有變動的項目；沒有基準（第一次存檔）就回 null 代表整包送 */
  partsChanged(snap){
    if(!cloud.synced) return null;
    const changed = [];
    SYNC_PARTS.forEach(function(k){ if(snap[k] !== cloud.synced[k]) changed.push(k); });
    if(!changed.length) return [];
    /* 同一張工作表的項目要一起送，避免只送一半把表寫壞 */
    SYNC_GROUPS.forEach(function(g){
      if(!g.some(function(k){ return changed.indexOf(k) >= 0; })) return;
      g.forEach(function(k){ if(changed.indexOf(k) < 0) changed.push(k); });
    });
    return changed;
  },
  /* 存檔：畫面先更新，背景寫回雲端試算表；成功會跳一次提醒 */
  async save(force){
    if(!API.reachable()){
      if(!cloud.noticed){ cloud.noticed = true; toast('目前沒有連上雲端，這次修改沒有存檔', 5600); }
      return { saved:false };
    }
    if(!force && !cloud.authoritative){
      cloud.pending = true;
      if(!cloud.noticed){
        cloud.noticed = true;
        toast('雲端資料還沒載入完成，這次修改沒有存檔；等載入完成再操作一次', 6000);
      }
      return { saved:false, pending:true };
    }
    /* 上一次還在傳：記下來，傳完再補一次，避免同時多筆請求互相蓋掉 */
    if(saving){ cloud.queued = true; return { queued:true }; }
    /* 先算這次真正改了哪幾項，只送這些；完全沒變動就連線都不必打 */
    const snap = API.snapshot();
    const changed = API.partsChanged(snap);
    if(changed && !changed.length){
      cloud.pending = false;
      return { saved:true, skipped:true };
    }
    const payload = { action:'saveAll', generation: cloud.generation || '' };
    if(changed){
      const sub = {};
      changed.forEach(function(k){ sub[k] = state[k]; });
      payload.parts = changed;
      payload.state = sub;
    }else{
      payload.state = state;
    }
    saving = true;
    renderCloudPill();
    try{
      /* 寫入比讀取慢，給比較寬的逾時；寫入不自動重試，避免重複落地 */
      const r = await API.call(payload, { timeoutMs: 30000 });
      cloud.pending = false;
      cloud.lastSaved = new Date();
      cloud.synced = snap;
      if(r.generation) cloud.generation = r.generation;
      saving = false;
      renderCloudPill();
      API.notifySaved();
      if(cloud.queued){ cloud.queued = false; return API.save(true); }
      return r;
    }catch(err){
      saving = false;
      /* 這次沒寫進去：記成「有修改還沒上傳」，下次連線時會補存，離開頁面也會提醒 */
      cloud.pending = true;
      renderCloudPill();
      throw err;
    }
  },
  /* 上傳成功跳提醒；連續編輯時不連發 */
  notifySaved(){
    const now = Date.now();
    if(now - cloud.toastAt < 2500) return;
    cloud.toastAt = now;
    const d = cloud.lastSaved || new Date();
    const p = function(n){ return String(n).padStart(2,'0'); };
    toast('已存到雲端　' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()), 2200);
  },
  /* 範本優先讀專案內的 templates/ 相對路徑，讀不到才退回雲端範本 */
  async template(name){
    if(TPL[name]) return TPL[name];
    const fname = CONFIG.TPL_NAMES[name];
    try{
      const res = await fetch('templates/'+encodeURIComponent(fname), { cache:'no-store' });
      if(res.ok){
        TPL[name] = await res.arrayBuffer();
        return TPL[name];
      }
    }catch(err){ /* 用 file:// 直接開檔案時會失敗，改走下面的備援 */ }
    if(API.isCloud()){
      try{
        const json = await API.call({ action:'getTemplate', name });
        const bin = atob(json.base64), buf = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
        TPL[name]=buf.buffer;
        return TPL[name];
      }catch(err){ /* 雲端也沒有，往下給統一說明 */ }
    }
    throw new Error('讀不到範本 '+fname+'（目前用 '+location.protocol+' 開啟）。'
      + '請確認 templates 資料夾的檔案有一起推上 GitHub，並用 GitHub Pages 或本機伺服器開這個網頁；'
      + '直接開 index.html 檔案時瀏覽器不准讀本機檔案，請按「選擇範本檔」手動載入');
  },
  /* 開頁後在背景先把三個範本讀進記憶體，第一次匯出就不用等 */
  async warmTemplates(){
    for(const n of ['seat','violation','roster']){
      if(TPL[n]) continue;
      try{
        const res = await fetch('templates/'+encodeURIComponent(CONFIG.TPL_NAMES[n]), { cache:'no-store' });
        if(res.ok) TPL[n] = await res.arrayBuffer();
      }catch(err){ /* 讀不到就算了，匯出時會再試一次並給提示 */ }
    }
    return Object.keys(TPL).filter(function(k){ return TPL[k]; });
  }
};

/* ---------- 進站關卡：一進網頁先輸入通關密語 ---------- */
const GATE = {
  KEY_PWD: 'nightstudy.pwd',
  KEY_HASH: 'nightstudy.pwdhash',
  /* 只用來當離線時的比對依據，不是密語本體 */
  async hash(s){
    const txt = 'nightstudy:' + String(s==null ? '' : s);
    if(window.crypto && crypto.subtle && crypto.subtle.digest && window.TextEncoder){
      try{
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
      }catch(err){ /* 非安全來源（file://）時退回下面的簡單雜湊 */ }
    }
    let h = 5381;
    for(let i=0;i<txt.length;i++) h = ((h*33) ^ txt.charCodeAt(i)) >>> 0;
    return 'djb2-' + h.toString(16);
  },
  /* 密語能不能過：連得上後端就向後端 ping 驗證；連不上才用這台裝置上次驗證成功的雜湊比對 */
  async verify(raw){
    const pwd = String(raw==null ? '' : raw);
    if(!pwd.trim()) return { ok:false, msg:'請先輸入通關密語' };
    const savedHash = localStorage.getItem(GATE.KEY_HASH) || '';
    if(!API.isCloud()){
      if(!savedHash) return { ok:true, local:true };
      return (await GATE.hash(pwd)) === savedHash ? { ok:true, local:true } : { ok:false, msg:'通關密語不正確' };
    }
    const prev = CONFIG.PASSWORD;
    CONFIG.PASSWORD = pwd;
    try{
      const r = await GATE.withTimeout(API.call({ action:'ping' }), 10000);
      if(r && r.timedOut){
        CONFIG.PASSWORD = prev;
        if(savedHash && (await GATE.hash(pwd)) === savedHash) return { ok:true, offline:true };
        return { ok:false, msg:'後端回應太慢，請再試一次' };
      }
      cloud.hasTeacher = !!(r && r.hasTeacher);
      return { ok:true, role: (r && r.role) || 'admin', hasTeacher: !!(r && r.hasTeacher), old: !(r && r.role) };
    }catch(err){
      CONFIG.PASSWORD = prev;
      const m = String((err && err.message) || '');
      if(m.indexOf('通關密語不正確') >= 0) return { ok:false, msg:'通關密語不正確，請再試一次' };
      if(m.indexOf('後端還沒設定通關密語') >= 0) return { ok:false, msg:m };
      if(savedHash && (await GATE.hash(pwd)) === savedHash) return { ok:true, offline:true };
      return { ok:false, msg:'連不上雲端，現在無法確認密語：' + (m || '請確認網路後再試一次') };
    }
  },
  /* 這台裝置有沒有記住密語：只看本機紀錄，不等網路，開頁就能進站 */
  async saved(){
    const pwd = localStorage.getItem(GATE.KEY_PWD) || '';
    if(!pwd) return { ok:false };
    const savedHash = localStorage.getItem(GATE.KEY_HASH) || '';
    if(savedHash){
      let now = '';
      try{ now = await GATE.hash(pwd); }catch(err){ now = ''; }
      if(now && now !== savedHash) return { ok:false, stale:true };
    }
    return { ok:true };
  },
  /* 背景向後端確認一次：只有後端明確說密語不對才回 'stale'，連不上或太慢都當沒事 */
  async checkSaved(){
    const pwd = localStorage.getItem(GATE.KEY_PWD) || '';
    if(!pwd || !API.isCloud()) return '';
    try{
      const r = await GATE.withTimeout(API.call({ action:'ping' }), 8000);
      if(r && r.timedOut) return '';
    }catch(err){
      const m = String((err && err.message) || '');
      if(m.indexOf('通關密語不正確') >= 0) return 'stale';
      if(m.indexOf('後端還沒設定通關密語') >= 0) return 'stale';
      return '';
    }
    return '';
  },
  withTimeout(p, ms){
    return new Promise(function(resolve, reject){
      const t = setTimeout(function(){ resolve({ timedOut:true }); }, ms);
      p.then(function(v){ clearTimeout(t); resolve(v); },
        function(e){ clearTimeout(t); reject(e); });
    });
  },
  /* 清除這台裝置記住的密語，下次開網頁會重新要求輸入 */
  forget(){
    localStorage.removeItem(GATE.KEY_PWD);
    localStorage.removeItem(GATE.KEY_HASH);
  }
};

function showGate(note){
  return new Promise(function(resolve){
    const gate = $('gate'), inp = $('gatePwd'), go = $('gateGo'), msg = $('gateMsg');
    document.body.classList.add('gated');
    gate.hidden = false;
    inp.value = '';
    msg.className = 'msg'; msg.textContent = note || '';
    setTimeout(function(){ try{ inp.focus(); }catch(err){} }, 60);
    let busy = false;
    async function submit(){
      if(busy) return;
      const pwd = inp.value;
      /* 身分由後端判定：設定表的密語第一組是管理員，其餘都是輪值教師 */
      busy = true; go.disabled = true;
      msg.className = 'msg'; msg.textContent = '正在確認密語…';
      let r;
      try{ r = await GATE.verify(pwd); }
      catch(err){ r = { ok:false, msg:'確認失敗：' + err.message }; }
      busy = false; go.disabled = false;
      if(!r.ok){
        msg.className = 'msg ng'; msg.textContent = r.msg || '通關密語不正確';
        try{ inp.select(); }catch(err){}
        return;
      }
      CONFIG.PASSWORD = pwd;
      localStorage.setItem(GATE.KEY_PWD, pwd);
      ROLE = (r.role === 'teacher') ? 'teacher' : 'admin';
      localStorage.setItem(CONFIG.ROLE_KEY, ROLE);
      try{ localStorage.setItem(GATE.KEY_HASH, await GATE.hash(pwd)); }catch(err){}
      if($('cfgPwd')) $('cfgPwd').value = pwd;
      renderMemoState();
      msg.className = 'msg ok'; msg.textContent = ROLE === 'teacher' ? '輪值教師登入中…' : '密語正確，進入中…';
      unlockUI();
      if(ROLE === 'teacher'){
        toast(r.old ? '後端還是舊版，無法辨識教師密語：請管理員重新部署 Code.gs'
          : '輪值教師登入：可點名、可編輯今天的輪值日誌', 6000);
      }
      if(r.old) toast('後端版本較舊：教師密語要重新部署 Code.gs 才會生效', 6000);
      if(r.offline) toast('現在連不上雲端，先用這台裝置上次同步的資料', 5200);
      else if(r.local) toast('本機模式：資料只存在這台裝置', 4200);
      /* 身分剛切換過來時畫面上可能還沒有名冊，補載一次 */
      if(API.reachable() && !(state.students || []).length) loadFromCloud().catch(function(){});
      resolve();
    }
    /* 用 onclick 指派，反覆開關卡也不會疊出多個監聽 */
    go.onclick = submit;
    inp.onkeydown = function(e){
      if(e.key === 'Enter'){ e.preventDefault(); submit(); }
    };
  });
}

/* 開彈窗；onCancel 是「取消」時要補做的事（例如把狀態退回去），不給就只是關掉 */
function modal(title, bodyHTML, footHTML, wide, onCancel){
  const root = $('modalRoot');
  root.__onCancel = typeof onCancel === 'function' ? onCancel : null;
  root.innerHTML = '<div class="overlay"><div class="modal'+(wide?' wide':'')+'"><h3>'+title+'</h3>'
    +'<div class="body">'+bodyHTML+'</div><div class="foot">'+footHTML+'</div></div></div>';
  return root.firstElementChild;
}
function closeModal(){
  const root = $('modalRoot');
  root.__onCancel = null;
  root.innerHTML='';
}
/* 取消（按取消鍵或點外面）：先把「要補做的事」記下來，關掉之後再執行 */
function cancelModal(){
  const root = $('modalRoot');
  const hook = root.__onCancel;
  root.__onCancel = null;
  root.innerHTML='';
  if(typeof hook === 'function'){ try{ hook(); }catch(err){} }
}

/* 點彈窗外面的空白處就關閉：按下與放開都在遮罩上才算，拖曳選字或滑動不會誤關 */
let overlayDown = false;
document.addEventListener('pointerdown', function(e){
  overlayDown = !!(e.target && e.target.classList && e.target.classList.contains('overlay'));
});
document.addEventListener('click', function(e){
  const onOverlay = !!(e.target && e.target.classList && e.target.classList.contains('overlay'));
  const wasDown = overlayDown;
  overlayDown = false;
  if(onOverlay && wasDown) cancelModal();
});
/* 站內確認視窗：取代瀏覽器原生 confirm，手機也看得清楚 */
function confirmModal(title, messageHTML, onOk, okLabel){

    '<button class="btn" data-close>取消</button><button class="btn seal" data-ok>'+esc(okLabel||'確定')+'</button>');
  m.querySelector('[data-close]').addEventListener('click', closeModal);
  m.querySelector('[data-ok]').addEventListener('click', function(){ closeModal(); onOk(); });
}

function renderCloudPill(){
  const el = $('topRight');
  if(!el) return;
  let text = '雲端模式', cls = 'ok';
  if(!API.isCloud()){ text = '本機模式'; cls = ''; }
  else if(saving){ text = '儲存中…'; cls = ''; }
  else if(cloud.loading){
    const secs = cloud.t0 ? Math.max(0, Math.round((Date.now()-cloud.t0)/1000)) : 0;
    text = cloud.retries ? ('連線不穩，重試 '+cloud.retries+'／3') : ('雲端載入中' + (secs ? '　'+secs+' 秒' : '…'));
    cls = '';
  }
  else if(cloud.failed){ text = '無法連上雲端'; cls = 'bad'; }
  else if(!cloud.authoritative){ text = CONFIG.PASSWORD ? '雲端載入中…' : '雲端未連線'; cls = ''; }
  else if(cloud.lastSaved){
    const d = cloud.lastSaved;
    text = '已存 ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  el.innerHTML = '<span class="pill '+cls+'">'+text+'</span>';
}

let cloudTick = null;

  }else if(!on && cloudTick){

  }
