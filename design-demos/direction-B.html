<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 B・夜自習點名簿</title>
<style>
:root{
  --paper:#E8DDC4; --sheet:#F3EBD9; --sheet-2:#EEE4CE;
  --ink:#1F1B15; --ink-2:#4A4237; --ink-3:#6C6251;
  --rule:#C3B394; --rule-soft:#D6C9AC;
  --seal:#9E2B18; --seal-soft:#B8543F;
  --serif:"Noto Serif TC","標楷體","DFKai-SB",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.75}
body{
  background-image:
    repeating-linear-gradient(90deg, rgba(120,100,70,.045) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(0deg, rgba(120,100,70,.03) 0 1px, transparent 1px 5px);
  padding:22px;
}
.sheet{
  background:var(--sheet);border:1px solid var(--rule);
  box-shadow:0 1px 0 #fff inset, 0 18px 40px rgba(80,64,40,.16);
  min-height:calc(100vh - 44px);display:grid;grid-template-columns:184px minmax(0,1fr) 190px;
  animation:rise .5s ease-out both;
}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}

/* 右：書名題簽（直排） */
.title-rail{
  grid-column:3;border-left:1px solid var(--rule);padding:26px 0;
  display:flex;flex-direction:column;align-items:center;gap:22px;
}
.title-rail .stack{writing-mode:vertical-rl;text-orientation:upright;display:flex;gap:14px;align-items:flex-start}
.title-rail h1{
  margin:0;font-family:var(--serif);font-size:38px;letter-spacing:.34em;font-weight:600;line-height:1.1;
}
.title-rail .sub{
  margin:0;font-family:var(--serif);font-size:13px;letter-spacing:.28em;color:var(--ink-2);
  border-right:1px solid var(--rule);padding-right:10px;
}
.seal{
  width:56px;height:56px;border:2px solid var(--seal);border-radius:3px;color:var(--seal);
  display:grid;grid-template-columns:1fr 1fr;place-items:center;font-family:var(--serif);
  font-size:19px;font-weight:700;line-height:1;transform:rotate(-2.4deg);opacity:.94;
  animation:stamp .42s cubic-bezier(.2,1.4,.4,1) .18s both;
}
.seal span{padding:2px}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(1.5)}to{opacity:.94;transform:rotate(-2.4deg) scale(1)}}
.title-rail .night{margin-top:auto;font-family:var(--serif);font-size:13px;letter-spacing:.2em;color:var(--ink-3)}

/* 左：今日要點 */
.stats{border-right:1px solid var(--rule);padding:26px 20px;display:flex;flex-direction:column;gap:20px}
.stats h2{margin:0;font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.22em;color:var(--ink-2)}
.stat{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule-soft);padding-bottom:7px}
.stat .n{font-family:var(--serif);font-size:31px;line-height:1;font-weight:600}
.stat .k{font-size:12px;color:var(--ink-3);letter-spacing:.16em}
.stat.warn .n{color:var(--seal)}
.stats .foot{margin-top:auto;font-size:12px;color:var(--ink-3);line-height:1.9}

/* 中：帳冊 */
.ledger{padding:26px 26px 30px;min-width:0}
.ledger-head{display:flex;align-items:flex-end;gap:14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.ledger-head h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.12em}
.ledger-head .meta{margin-left:auto;font-size:12px;color:var(--ink-3);letter-spacing:.1em}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  font-family:var(--serif);font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--ink-2);
  padding:9px 6px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap;
}
thead th.d,td.d{text-align:center;width:34px}
tbody td{padding:8px 6px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
tbody tr{animation:lineIn .34s ease-out both;animation-delay:calc(var(--i) * 13ms)}
@keyframes lineIn{from{transform:translateY(2px)}to{transform:none}}
.c{font-family:var(--serif);font-size:13px;color:var(--ink-2);letter-spacing:.06em}
.s{font-family:var(--serif);font-size:13px;color:var(--ink-3)}
.nm{font-family:var(--serif);font-size:16px;letter-spacing:.1em}
.mk{font-family:var(--serif);font-size:15px;color:var(--ink)}
.mk .off{color:#B9AC92}
tbody tr:hover{background:var(--sheet-2)}
.band{background:var(--sheet-2)}
.band td{font-family:var(--serif);font-size:13px;letter-spacing:.22em;color:var(--ink-2);padding:7px 6px}
.ledger-foot{margin-top:14px;font-size:12px;color:var(--ink-3);display:flex;gap:18px}

@media (max-width:1080px){
  .sheet{grid-template-columns:minmax(0,1fr) 150px}
  .stats{display:none}
  .title-rail{grid-column:2}
}
@media (max-width:720px){
  body{padding:10px}
  .sheet{grid-template-columns:minmax(0,1fr)}
  .title-rail{grid-column:1;border-left:0;border-top:1px solid var(--rule);order:2;padding:18px}
  .title-rail .stack{writing-mode:horizontal-tb}
  .title-rail h1{font-size:26px;letter-spacing:.2em}
  .title-rail .sub{border-right:0;padding:0}
  .title-rail .night{margin-top:12px}
  .ledger{padding:18px 14px}
  .ledger-head{flex-wrap:wrap}
  .nm{font-size:15px}
}
</style>
</head>
