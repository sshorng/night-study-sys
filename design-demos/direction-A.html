<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 A・夜自習運轉板</title>
<style>
:root{
  --bg:#0B0D10; --panel:#14181E; --panel-2:#101419; --line:#262D36; --line-soft:#1C222A;
  --fg:#E8EAEE; --fg-2:#C2C9D4; --fg-3:#AEB6C2;
  --lamp:#E5A13C; --lamp-dim:#7A5620; --alert:#C96A4F; --ok:#4E9E7A;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  --sans:"Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.7}
body{-webkit-font-smoothing:antialiased}
.shell{min-height:100vh;display:flex;flex-direction:column}

/* 頂列 */
.bar{display:flex;align-items:baseline;gap:28px;padding:18px 28px;border-bottom:1px solid var(--line)}
.brand{font-size:15px;letter-spacing:.02em;font-weight:700}
.brand span{display:block;font-size:12px;font-weight:400;color:var(--fg-3);letter-spacing:.14em}
.clock{font-family:var(--mono);font-size:13px;color:var(--fg-2);letter-spacing:.04em}
.clock span{color:var(--fg-3);margin-left:8px}
.counts{margin-left:auto;font-size:12px;color:var(--fg-3);letter-spacing:.08em}
.counts b{font-family:var(--mono);font-size:20px;color:var(--fg);font-weight:600;margin:0 4px}
.counts .live{color:var(--lamp)}
.counts .live b{color:var(--lamp)}

/* 版面 */
main{flex:1;display:grid;grid-template-columns:92px minmax(0,1fr) 322px}

/* 左：班級索引 */
.platforms{border-right:1px solid var(--line);padding:14px 0;background:var(--panel-2)}
.platforms .idx{display:block;width:100%;padding:9px 0;text-align:center;font-family:var(--mono);font-size:13px;
  color:var(--fg-3);letter-spacing:.06em;background:transparent;border:0;
  border-left:2px solid transparent;cursor:pointer;appearance:none}
.platforms .idx em{display:block;font-family:var(--sans);font-size:12px;font-style:normal;color:#8E97A6;letter-spacing:0}
.platforms .idx[aria-selected="true"]{color:var(--fg);border-left-color:var(--lamp);background:#171C23}
.platforms .idx[aria-selected="true"] em{color:var(--lamp)}
.platforms .all{padding:6px 0 12px;text-align:center;font-size:12px;color:#8E97A6;letter-spacing:.1em}

/* 中：今日名單 */
.board{display:flex;flex-direction:column;min-width:0}
.board-head{display:flex;align-items:baseline;gap:14px;padding:20px 28px 14px}
.board-head h1{margin:0;font-size:13px;font-weight:400;color:var(--fg-2);letter-spacing:.14em}
.board-head .big{font-family:var(--mono);font-size:46px;line-height:1;color:var(--lamp);font-weight:600}
.board-head .unit{font-size:12px;color:var(--fg-3)}
.board-head .state{margin-left:auto;font-size:12px;color:var(--fg-3);letter-spacing:.06em}
.board-head .state::before{content:"";display:inline-block;width:6px;height:6px;background:var(--ok);
  border-radius:50%;margin-right:7px;vertical-align:middle}

.roster{list-style:none;margin:0;padding:0 12px 28px;overflow:auto}
.row{display:grid;grid-template-columns:52px 1fr 138px 62px;align-items:center;gap:8px;
  padding:7px 16px;border-bottom:1px solid var(--line-soft);animation:rowIn .3s ease-out both;
  animation-delay:calc(var(--i) * 14ms)}
.row:first-child{border-top:1px solid var(--line)}
.seat{font-family:var(--mono);font-size:13px;color:var(--fg-3);letter-spacing:.06em}
.name{font-size:15px;letter-spacing:.04em}
.days{font-family:var(--mono);font-size:15px;letter-spacing:.34em;color:var(--fg-3)}
.days b{color:var(--lamp);font-weight:400}
.cls{font-family:var(--mono);font-size:12px;color:var(--fg-3);text-align:right;letter-spacing:.04em}
.row:hover{background:#171C23}

/* 右：各班本週 */
.departures{border-left:1px solid var(--line);padding:20px 20px 28px;background:var(--panel-2)}
.departures h2{margin:0 0 4px;font-size:12px;font-weight:400;color:var(--fg-3);letter-spacing:.16em}
.departures p.note{margin:0 0 18px;font-size:12px;color:#8E97A6}
.dept{display:grid;grid-template-columns:44px 1fr 30px;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line-soft)}
.dept .c{font-family:var(--mono);font-size:12px;color:var(--fg-2);letter-spacing:.04em}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.bars i{display:block;height:7px;background:#232A33;border-radius:1px;position:relative}
.bars i b{position:absolute;inset:0;background:var(--lamp);border-radius:1px;transform-origin:left;
  animation:barIn .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d) * 40ms)}
.dept .sum{font-family:var(--mono);font-size:12px;color:var(--fg-3);text-align:right}
.axis{display:grid;grid-template-columns:44px 1fr 30px;gap:10px;margin-top:8px}
  font-size:12px;color:#8E97A6;text-align:center;letter-spacing:0}

@keyframes rowIn{from{transform:translateY(4px)}to{transform:none}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* 窄螢幕 */
@media (max-width:1000px){
  main{grid-template-columns:64px minmax(0,1fr)}
  .departures{display:none}
  .row{grid-template-columns:44px 1fr 118px}
  .cls{display:none}
  .board-head{padding:16px 18px 10px}
  .board-head .big{font-size:36px}
  .row{padding:9px 10px}
}
@media (max-width:520px){
  .bar{flex-wrap:wrap;gap:10px;padding:14px 16px}
  .counts{margin-left:0;width:100%}
  main{grid-template-columns:minmax(0,1fr)}
  .platforms{display:none}
  .days{letter-spacing:.2em;font-size:14px}
}
</style>
</head>
