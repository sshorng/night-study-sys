<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 C・夜自習工作台</title>
<style>
:root{
  --bg:#F6F6F3; --card:#FFFFFF; --line:#E4E2DB; --line-2:#EFEDE6;
  --ink:#16181C; --ink-2:#4E5561; --ink-3:#616976;
  --accent:#0F6F63; --accent-soft:#E4F0ED; --warn:#B4522F;
  --sans:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}

/* 左側導覽 */
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:26px}
.side .brand{font-size:15px;font-weight:700;letter-spacing:.02em}
.side .brand small{display:block;font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:.1em;margin-top:2px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:9px;
  color:var(--ink-2);text-decoration:none;font-size:13px}
.side nav a:hover{background:var(--bg)}
.side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side nav a .n{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.side nav a[aria-current="page"] .n{color:var(--accent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--ink-3);line-height:1.8}

/* 主區 */
.main{padding:22px 26px 34px;min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
.top .date{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.top .pills{margin-left:auto;display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;font-size:12px;color:var(--ink-2)}
.pill b{font-family:var(--mono);font-size:14px;color:var(--ink)}
.pill.accent{border-color:#BFDAD4;background:var(--accent-soft)}
.pill.accent b{color:var(--accent)}

/* 首屏：數字＋本週矩陣 */
.hero{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:18px}
.figure{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.figure .k{font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.figure .n{font-family:var(--mono);font-size:64px;line-height:1.05;font-weight:600;letter-spacing:-.02em}
.figure .n span{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--ink-3);margin-left:6px;letter-spacing:0}
.figure .sub{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.figure .sub b{font-family:var(--mono);font-size:14px;color:var(--ink);margin-right:3px}
.figure .sub .warn b{color:var(--warn)}

.matrix{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.matrix h2{margin:0 0 2px;font-size:13px;font-weight:700}
.matrix p{margin:0 0 14px;font-size:12px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:5px;align-items:center}
.grid .h{font-size:12px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.grid .h.now{color:var(--accent);font-weight:700}
.grid .c{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.cell{aspect-ratio:1.55;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;
  color:var(--ink);background:#EFF3F1;animation:pop .3s ease-out both;animation-delay:calc(var(--d) * 11ms)}
.cell.dark{color:#fff}
.cell.zero{color:var(--ink-3);background:#F3F3F0}
@keyframes pop{from{transform:scale(.94)}to{transform:none}}

/* 名單 */
.roster{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.roster header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.roster header h2{margin:0;font-size:13px;font-weight:700}
.roster header .hint{font-size:12px;color:var(--ink-3)}
.roster header .chips{margin-left:auto;display:flex;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:12px;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{max-height:calc(100vh - 470px);min-height:210px;overflow:auto}
.item{display:grid;grid-template-columns:54px 1fr auto 118px;align-items:center;gap:12px;padding:9px 18px;
  border-bottom:1px solid var(--line-2)}
.item:hover{background:#FBFBF9}
.item .seat{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.item .nm{font-size:14px}
.item .cls{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.days{display:flex;gap:5px}
.days button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;
  font-family:var(--sans);font-size:12px;color:var(--ink-3);cursor:pointer;transition:background .12s,border-color .12s}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.days button:hover{border-color:var(--ink-3)}
.roster footer{padding:10px 18px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line-2)}

@media (max-width:1100px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;gap:14px;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;overflow:auto}
  .side .foot{display:none}
  .side nav{flex-direction:row;gap:4px}
  .hero{grid-template-columns:1fr}
  .list{max-height:none}
}
@media (max-width:620px){
  .main{padding:16px 14px 26px}
  .figure .n{font-size:48px}
  .grid{grid-template-columns:44px repeat(5,minmax(0,1fr));gap:4px}
  .cell{font-size:12px;border-radius:6px}
  .item{grid-template-columns:40px 1fr;row-gap:8px;padding:10px 14px}
  .item .days{grid-column:1 / -1}
  .item .cls{grid-column:1 / -1}
}
</style>
</head>
